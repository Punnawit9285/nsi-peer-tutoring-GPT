<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nervous System I &#183; Peer tutoring deck (Tutor)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  /* Layout: a lab-bench stage. One large card at a time on chart-recorder paper, a strip of eight lab stations above, a sticky pager below. Browse = one scrolling worksheet. */
  --paper: #f3f5f8;      /* page ground, cool grey */
  --sheet: #ffffff;      /* card */
  --sheet2: #edf0f5;     /* inset panels */
  --ink: #19202e;        /* text */
  --ink2: #4f5a6e;       /* secondary text */
  --rule: #d4dae4;       /* hairlines */
  --grid: #e9edf3;       /* chart-paper grid */
  --art: #ae1530;        /* arterial red: brand, tracings */
  --art-soft: #fbe5e9;
  --ven: #1f4f97;        /* venous blue: controls, second tracing */
  --ven-soft: #e2ebf8;
  --ok: #13744a; --ok-soft: #dff2e7;
  --bad: #b02f19; --bad-soft: #fbe6df;
  --warn: #775100; --warn-soft: #fbefd2;
  --scanbg: #ffffff;     /* paper behind real figures */
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
    --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
    --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
  --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
  --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ven); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- cards ---------- */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: clamp(16px, 2.6vw, 34px); min-width: 0; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.eyebrow .id { font-weight: 600; color: var(--art); font-size: 1.12em; letter-spacing: .02em; }
.chip { border-radius: 999px; padding: 2px 9px; background: var(--sheet2); color: var(--ink2); white-space: nowrap; }
.chip.core { background: var(--art-soft); color: var(--art); }
.chip.kind { background: var(--ven-soft); color: var(--ven); }
.chip.grp { background: transparent; border: 1px dashed var(--rule); }
.concept h2, .secard h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.6em; line-height: 1.2; margin: 0 0 14px; text-wrap: balance; letter-spacing: .005em; }
.cbody { display: grid; gap: 16px; }
.cbody > * { min-width: 0; }
.muted { color: var(--ink2); font-weight: 400; }

/* ---------- question cards ---------- */
.stem { font-size: 1.26em; font-weight: 500; line-height: 1.45; margin: 2px 0 16px; text-wrap: pretty; }
.stem b { color: var(--art); font-weight: 600; }
.stem .muted { font-size: .82em; display: block; margin-top: 4px; }
.qfig { margin: 0 0 16px; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.opt { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--sheet); color: var(--ink); border: 1.5px solid var(--rule); border-radius: 10px; padding: .6em .85em; cursor: pointer; transition: border-color .15s, background-color .15s, opacity .15s; line-height: 1.4; }
.opt:hover { border-color: var(--ven); }
.opt .L { font: 600 .88em var(--f-mono); width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--rule); color: var(--ink2); }
.opt .mk { font-weight: 700; min-width: 1em; }
.opt.sel { border-color: var(--ven); background: var(--ven-soft); }
.opt.sel .L { border-color: var(--ven); color: var(--ven); }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { padding: .9em 1em; font-size: 1.08em; font-weight: 500; }
.rev .opt { cursor: default; }
.rev .opt.isans, .showall .opt.isans { border-color: var(--ok); background: var(--ok-soft); }
.rev .opt.isans .L, .showall .opt.isans .L { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.rev .opt.isans .mk::after, .showall .opt.isans .mk::after { content: "\2713"; color: var(--ok); }
.rev .opt.sel:not(.isans) { border-color: var(--bad); background: var(--bad-soft); }
.rev .opt.sel:not(.isans) .L { border-color: var(--bad); color: var(--bad); }
.rev .opt.sel:not(.isans) .mk::after { content: "\2717"; color: var(--bad); }
.rev .opt:not(.isans):not(.sel) { opacity: .55; }
.think { margin: 0; color: var(--ink2); font-style: italic; }
.explain { margin-top: 16px; background: var(--ok-soft); border-radius: 12px; padding: 14px 18px; }
.qcard:not(.rev) .explain { display: none; }
.showall .qcard .explain { display: block; }
.explain .ans { font: 600 1.02em var(--f-display); color: var(--ok); margin-bottom: 4px; }
.explain p { margin: 0; }
.flag { margin-top: 10px; background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; font-size: .9em; }
.flag b { color: var(--warn); }

/* ---------- concept building blocks ---------- */
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.figpair { grid-template-columns: minmax(0, .75fr) minmax(0, 1.25fr); align-items: center; }
@media (max-width: 760px) { .two, .cols2, .cols3, .figpair { grid-template-columns: 1fr; } }
.mini { background: var(--sheet2); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.mini h4 { margin: 0 0 6px; font: 600 1em var(--f-display); letter-spacing: .01em; }
.mini.art h4 { color: var(--art); }
.mini.ven h4 { color: var(--ven); }
.mini p { margin: 0; }
.mini ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.pts { margin: 0; padding-left: 1.2em; display: grid; gap: 7px; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 7px; }
.steps.tight { gap: 3px; }
.note { margin: 0; background: var(--ven-soft); border-radius: 10px; padding: 10px 14px; }
.trap { margin: 0; background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; }
.trap::before { content: "Exam trap \00B7  "; font-weight: 600; color: var(--warn); }
.eqn { font: 600 1.65em var(--f-display); text-align: center; letter-spacing: .02em; padding: 6px 0; }
.eqn span { color: var(--art); }
.speeds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .speeds { grid-template-columns: 1fr; } }
.speed { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--sheet); }
.sp-h { display: grid; gap: 2px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--rule); }
.sp-h .mono { font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.s1 .sp-h b { color: var(--art); }
.s2 .sp-h b { color: var(--warn); }
.s3 .sp-h b { color: var(--ven); }
.speed ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.flow.col { flex-direction: column; align-items: stretch; }
.fbox { border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 8px 12px; flex: 1 1 140px; min-width: 0; }
.fbox.start { background: var(--sheet2); }
.fbox.end { background: var(--ok-soft); border-color: var(--ok); }
.fbox.art { background: var(--art-soft); border-color: var(--art); }
.fbox.ven { background: var(--ven-soft); border-color: var(--ven); }
.farrow { color: var(--ink2); font-weight: 600; flex: none; text-align: center; }
.flow.col .farrow { font-size: .9em; }
.fstack { display: grid; gap: 8px; flex: 2 1 260px; min-width: 0; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 600px) { .fgrid { grid-template-columns: 1fr; } }
.cycle { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.cycle .ph { flex: 1 1 130px; background: var(--sheet2); border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: .92em; display: grid; gap: 2px; align-content: start; }
.cycle .ph span { font-weight: 400; color: var(--ink2); font-size: .88em; }
.cycle .sd { flex: none; align-self: center; font: 700 .9em var(--f-mono); color: var(--sheet); background: var(--ink); border-radius: 999px; padding: 4px 10px; }

/* ---------- tables ---------- */
.tblwrap { overflow-x: auto; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92em; }
.tbl caption { text-align: left; font: 600 .95em var(--f-display); padding-bottom: 6px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--rule); padding: 7px 10px; text-align: left; vertical-align: top; }
.tbl thead th { font-family: var(--f-mono); font-size: .76em; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); background: var(--sheet2); }
.tbl td.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); white-space: nowrap; }
.tbl .up { color: var(--art); font-weight: 600; }
.tbl .dn { color: var(--ven); font-weight: 600; }
.tbl thead th.up { color: var(--art); }
.tbl thead th.dn { color: var(--ven); }
.tbl.compact th, .tbl.compact td { padding: 4px 8px; }
.dogtbl td:nth-child(2), .dogtbl td:nth-child(3), .dogtbl td:nth-child(4) { text-align: center; white-space: nowrap; }
.dogtbl.txt4 td:nth-child(4) { text-align: left; white-space: normal; }  /* 4th column is a "Why" sentence, not a number */

/* ---------- real figures cropped from the course material ---------- */
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
.scan { margin: 0; min-width: 0; display: grid; gap: 6px; align-content: start; }
.paperimg { background: var(--scanbg); border: 1px solid var(--rule); border-radius: 10px; padding: 8px; isolation: isolate; }
.scan img { display: block; width: auto; max-width: 100%; height: auto; max-height: min(440px, 62vh); margin: 0 auto; mix-blend-mode: multiply; cursor: zoom-in; border-radius: 4px; }
.scan.tall img { max-height: min(480px, 66vh); }
.scanrow .scan img { max-height: 360px; }
.scan figcaption { font-size: .84em; line-height: 1.4; color: var(--ink2); text-wrap: pretty; }
.scan figcaption .src { font-family: var(--f-mono); font-size: .88em; white-space: nowrap; opacity: .9; }
.scan figcaption .src::before { content: "\00B7  "; }
.scan figcaption.srconly .src::before { content: none; }
.scanrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; align-items: start; min-width: 0; }
.qfig .scan { max-width: 760px; }
.qfig .scan.tall { max-width: 560px; }

/* ---------- cloze blanks: {{key detail}} in concept cards ---------- */
.cz { border-radius: 4px; padding: 0 .22em; background: var(--sheet2); color: transparent; box-shadow: inset 0 -2px 0 var(--art); cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: color .18s, background-color .18s; }
.cz * { color: transparent !important; }
.cz:hover { background: var(--art-soft); }
.cz.on, .czopen .cz, .showall .cz { color: inherit; background: var(--art-soft); }
.cz.on *, .czopen .cz *, .showall .cz * { color: inherit !important; }
.cz.last { animation: czpop .5s ease-out; }
@keyframes czpop { 0% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 4px var(--art-soft); } 100% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 0 transparent; } }
@media print { .cz { color: inherit; background: none; } .cz * { color: inherit !important; } }

/* ---------- figure zoom ---------- */
.zoom { position: fixed; inset: 0; z-index: 60; background: rgba(6, 8, 12, .88); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.zoom[hidden] { display: none; }
.zoom .zbox { display: grid; gap: 10px; justify-items: center; max-width: 100%; }
.zoom .zpaper { background: #fff; border-radius: 10px; padding: 10px; max-width: min(1700px, 100%); }
.zoom img { display: block; max-width: 100%; max-height: calc(100vh - 120px); width: auto; height: auto; }
.zoom .zcap { color: #e5e8ef; font-size: .92em; text-align: center; max-width: 900px; margin: 0; }

/* Thai explanation under each concept card (student deck: collapsible; tutor deck: open) */
.thx { margin-top: 16px; border: 1px solid var(--rule); border-left: 3px solid var(--ok); border-radius: 10px; background: var(--sheet); padding: 0 14px; }
.thx summary { cursor: pointer; padding: 10px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.thx summary::marker, .thx summary::-webkit-details-marker { color: var(--ok); }
.thx-h { font: 600 1.02em var(--f-display); color: var(--ok); }
.thx-s { font: .74em var(--f-mono); color: var(--ink2); }
.thx[open] summary { border-bottom: 1px dashed var(--rule); margin-bottom: 10px; }
.thx-body { display: grid; gap: 9px; padding-bottom: 14px; line-height: 1.7; font-family: "IBM Plex Sans Thai", var(--f-body); }
.thx-body p { margin: 0; }
ul.thx-body { margin: 0; padding: 0 0 14px 1.2em; gap: 6px; }
ul.thx-body li::marker { color: var(--ok); }
.thx-body b { font-weight: 600; color: var(--ink); }

/* cover: counts + QR to the live deck (student deck start card and PDF cover) */
.coverline { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 32px; margin: 4px 0 22px; padding: 14px 0 16px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.counts { display: flex; gap: 44px; }
.counts > div { display: grid; }
.counts b { font: 600 3.2em/1 var(--f-display); letter-spacing: -.01em; }
.counts span { font: .8em var(--f-mono); color: var(--ink2); letter-spacing: .04em; margin-top: 5px; }
.qrlink { display: grid; justify-items: end; gap: 6px; color: var(--ink2); text-decoration: none; }
.qrlink img { width: 112px; height: 112px; display: block; }
.qrlink span { font: .72em var(--f-mono); }
.qrlink .qrcap { font: 600 .78em var(--f-display); color: var(--ink); letter-spacing: .01em; }
.qrlink:hover span { color: var(--ven); text-decoration: underline; }
.legend { margin: 14px 0 0; font: .8em var(--f-mono); color: var(--ink2); }
.legend .chip { margin-right: 6px; }
@media (max-width: 560px) { .qrlink img, .qrlink .qrcap { display: none; } .qrlink { justify-items: start; } .counts b { font-size: 2.6em; } }
/* short concept cards (data/lite.js): arrow chains and brief bullets */
.lt { display: grid; gap: 10px; align-content: start; }
.lt-two { align-items: start; }
.lt-figs { display: grid; gap: 12px; }
.lt-chain { margin: 0; padding: 8px 12px; background: var(--sheet2); border-radius: 8px; line-height: 1.65; font-weight: 500; }
.lt-ar { color: var(--art); font-weight: 700; padding: 0 .12em; }
.lt-pts { margin: 0; padding-left: 1.15em; display: grid; gap: 4px; line-height: 1.5; }
.lt-h { margin: 4px 0 -4px; font: 600 .78em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); }
.lt-trap { margin: 0; background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: 8px; padding: 6px 10px; font-size: .95em; }
.lt-p { margin: 0; }
.lt-tbl { width: 100%; border-collapse: collapse; font-size: .95em; }
.lt-tbl th { text-align: left; font: 600 .78em var(--f-mono); text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); border-bottom: 1.5px solid var(--rule); padding: 4px 8px; }
.lt-tbl td { border-bottom: 1px solid var(--rule); padding: 5px 8px; vertical-align: top; }
.lt .eqn { font-size: 1.15em; padding: 2px 0; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--sheet); border-bottom: 1px solid var(--rule); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 18px; align-items: center; }
@media (max-width: 1020px) { .bar { grid-template-columns: minmax(0, 1fr) auto; } .tabs { grid-column: 1 / -1; order: 3; } }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.brand svg { flex: none; width: 38px; height: 22px; }
.brand b { display: block; font: 600 1.05rem var(--f-display); letter-spacing: .01em; white-space: nowrap; }
.brand small { display: block; color: var(--ink2); font: .72rem var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 6px; overflow-x: auto; min-width: 0; padding-block: 2px; scrollbar-width: thin; }
.tab { flex: none; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink2); border-radius: 999px; padding: 5px 12px; font-size: .84rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.tab:hover { border-color: var(--ven); color: var(--ink); }
.tab .k { font-family: var(--f-mono); color: var(--art); margin-right: 6px; font-weight: 600; }
.tab[aria-current="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.tab[aria-current="true"] .k { color: var(--art-soft); }
.ctrls { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.decklink { border: 1px solid var(--art); background: var(--art-soft); color: var(--art); border-radius: 8px; padding: 5px 10px; font-size: .82rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
.decklink:hover { background: var(--art); color: var(--sheet); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink2); padding: 6px 11px; font-size: .85rem; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ven); color: var(--sheet); }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--ink2); cursor: pointer; user-select: none; white-space: nowrap; }
.chk input { accent-color: var(--art); width: 16px; height: 16px; margin: 0; }
.icon { display: inline-grid; place-items: center; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 8px; height: 32px; width: 34px; padding: 0; cursor: pointer; }
.icon svg { width: 16px; height: 16px; }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 0; }
#present { max-width: 1180px; margin: 0 auto; }
#present .card { font-size: clamp(15px, .5vw + 11.5px, 20px); }
.stage { min-height: 55vh; }
.eyebrow .sp { flex: 1; }
.pager { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; background: var(--paper); padding-block: 12px calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: 14px; border-top: 1px solid var(--rule); }
.pos { font-family: var(--f-mono); font-size: .82rem; color: var(--ink2); text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pos span { color: var(--art); font-weight: 600; }
.btn { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 10px; padding: 9px 14px; font-size: .95rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ven); }
.btn.primary { background: var(--art); color: var(--sheet); border-color: var(--art); min-width: 7em; }
.btn.small { padding: 5px 11px; font-size: .85rem; }
.btn:disabled { opacity: .4; cursor: default; }
.prog { grid-column: 1 / -1; height: 3px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--art); width: 0; transition: width .2s; }
.keys { grid-column: 1 / -1; font: .72rem var(--f-mono); color: var(--ink2); text-align: center; }
@media (max-width: 560px) { .keys { display: none; } }

/* intro and section cards */
.secard .lede { font-size: 1.05em; color: var(--ink2); margin: 0 0 14px; max-width: 70ch; line-height: 1.55; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 26px; font-family: var(--f-mono); font-size: .82em; color: var(--ink2); margin-bottom: 16px; }
.stats b { font: 600 1.7em var(--f-display); color: var(--ink); display: block; line-height: 1.1; }
.minih { font: 600 .8em var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--ink2); margin: 14px 0 8px; }
.toc { margin: 0; padding-left: 0; list-style: none; columns: 2 280px; column-gap: 28px; }
.toc li { break-inside: avoid; margin-bottom: 5px; }
.toc .tid { font-family: var(--f-mono); color: var(--art); font-size: .85em; margin-right: 8px; }
.stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 4px 0 16px; }
.station { text-align: left; border: 1px solid var(--rule); background: var(--sheet2); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.station:hover { border-color: var(--ven); }
.station .k { font: 600 .78rem var(--f-mono); color: var(--art); }
.station b { font: 600 1.05rem var(--f-display); }
.station span:last-child { color: var(--ink2); font-size: .86rem; }

/* tutor bullet explanations & concept key points */
.ex-list { margin: 6px 0 0; padding-left: 1.25em; display: grid; gap: 5px; line-height: 1.55; }
.ex-list li::marker { color: var(--ok); }
.tpoints { margin-bottom: 14px; background: var(--ven-soft); border-left: 3px solid var(--ven); border-radius: 10px; padding: 10px 14px; }
.tpoints .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ven); margin-bottom: 4px; }
.tpoints ul { margin: 0; padding-left: 1.25em; display: grid; gap: 4px; line-height: 1.5; }
.traps-box { margin: 12px 0; background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: 10px; padding: 10px 14px; }
.traps-box .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--warn); margin-bottom: 4px; }
.traps-box ul { margin: 0; padding-left: 1.25em; display: grid; gap: 4px; line-height: 1.5; }

/* browse */
#browse { max-width: 1000px; margin: 0 auto; padding-bottom: 48px; }
.btools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 4px 6px; }
.btools input[type="search"] { flex: 1 1 260px; min-width: 0; border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 9px 12px; }
.bcount { font: .8rem var(--f-mono); color: var(--ink2); }
.bsec { display: grid; gap: 14px; margin-top: 28px; }
.bsec > header { scroll-margin-top: 130px; }
.bsec > header h2 { font: 600 1.5rem var(--f-display); margin: 0; text-wrap: balance; }
.bsec > header p { margin: 4px 0 0; color: var(--ink2); }
.bsec > header .eyebrow { margin-bottom: 6px; }
#blist .card { font-size: 15px; scroll-margin-top: 130px; }
#blist .stem { font-size: 1.1em; }

/* recording script: SAY lines, 80% summary, video plan */
.saybox { margin: 12px 0 0; background: var(--sheet2); border-left: 3px solid var(--art); border-radius: 10px; padding: 10px 14px; }
.concept .saybox, .secard .saybox { margin: 0 0 14px; }
.saybox .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--art); margin-bottom: 4px; }
.saybox p { margin: 0; line-height: 1.55; }
.u80 { margin: 12px 0; border: 1px solid var(--rule); border-radius: 10px; padding: 0 14px; background: var(--sheet); }
.u80 summary { cursor: pointer; padding: 10px 0; font: 600 .95em var(--f-display); }
.u80 summary span { font: 400 .78em var(--f-mono); color: var(--ink2); margin-left: 8px; }
.u80[open] summary { border-bottom: 1px dashed var(--rule); margin-bottom: 10px; }
.u80 ol { margin: 0 0 12px; padding-left: 1.3em; display: grid; gap: 7px; line-height: 1.5; }
.plan td:nth-child(4) { min-width: 15em; }
.plan td:first-child { white-space: nowrap; font-weight: 600; }
/* phone: controls get their own row so the header never widens the page */
@media (max-width: 640px) { .bar { grid-template-columns: minmax(0, 1fr); position: relative; } .ctrls { justify-content: flex-start; } }
.brand > div { min-width: 0; }
.brand b { overflow: hidden; text-overflow: ellipsis; }

/* tutor-only teaching notes: knowledge beyond the slide (src/tutor-notes.js) */
.tnotes { margin: 12px 0; background: var(--art-soft); border-left: 3px solid var(--art); border-radius: 10px; padding: 10px 14px; }
.tn-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--art); margin-bottom: 4px; }
.tnotes ul { margin: 0; padding-left: 1.2em; display: grid; gap: 3px; line-height: 1.45; }
.tdiag { margin: 8px 0 0; padding: 8px 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; font: .8em/1.45 var(--f-mono); white-space: pre; overflow-x: auto; color: var(--ink); }

<li>May need {{contrast}} media for soft tissue</li><li>{{characterization}}, vascularity, or vascular study</li></ul></div><figure class=\"scan\"><a href=\"img/I-c3.png\" target=\"_blank\"><img src=\"img/I-c3.png\" alt=\"Course figure from Imaging of Vertebral column and spinal cord, p.35\"></a><figcaption>Imaging of Vertebral column and spinal cord, p.35</figcaption></figure>"},{"t":"open","id":"I6","src":"Imaging of Vertebral column and spinal cord, p.35","core":true,"q":"What does CT improve over a superimposed plain projection?","ans":"CT improves contrast and spatial resolution and can display anatomy in multiple planes.","ex":"These are the imaging advantages listed on the CT slide."},{"t":"c","id":"I-C4","title":"Magnetic Resonance Imaging","src":"Imaging of Vertebral column and spinal cord, p.45","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Imaging of Vertebral column and spinal cord, p.45</div><ul><li>{{Strong}} magnetic field created by MRI scanner causes</li><li>hydrogen atom align in the same {{direction}}.</li><li>{{Radiofrequency}} (RF) pulse with the same {{frequency}} as</li><li>hydrogen’s spin {{frequency}} resonates the hydrogen atoms</li><li>and flip these atoms out of the {{original}} angle.</li></ul></div>"},{"t":"open","id":"I7","src":"Imaging of Vertebral column and spinal cord, p.45","core":false,"q":"Explain one key point from Magnetic Resonance Imaging in the cited slide.","ans":"Magnetic Resonance Imaging","ex":"The model answer restates the teaching slide."},{"t":"c","id":"I-C5","title":"Pars interarticularis on oblique radiography","src":"Imaging of Vertebral column and spinal cord, p.25","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Imaging of Vertebral column and spinal cord, p.25</div><ul><li>The {{oblique}} lumbar view assesses the {{posterior neural arch}}.</li><li>The {{pars interarticularis}} lies between the superior and inferior articular processes.</li><li>This projection gives the familiar {{Scotty dog}} appearance.</li><li>The pars forms the {{neck}} of that outline.</li><li>Check the side and level on the {{oblique}} projection before naming the structure.</li></ul></div>"},{"t":"q","id":"I8","src":"AC81 MCQ p.8","core":false,"q":"Which of the following can be seen white (high attenuation) in CT?","o":["Fat in epidural space","Spinal cord in thecal sac","Erector spinae muscle","Cerebrospinal fluid","Cortical bone in vertebra"],"a":4,"ex":"The attached AC81 short key gives E: Cortical bone in vertebra.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"open","id":"I9","src":"Imaging of Vertebral column and spinal cord, p.25","core":false,"q":"In Pars interarticularis on oblique radiography, identify the missing course detail in the first statement.","ans":"posterior neural arch","ex":"The cited course page identifies posterior neural arch in this context."}]});

CVS.add({"id":"N","short":"Nervous tissue","title":"Nervous tissue","kind":"Lecture","blurb":"Neurons, glia, fibers, receptors and histologic recognition.","items":[{"t":"c","id":"N-C1","title":"Neuron compartments","src":"Nervous tissue, p.8","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Nervous tissue, p.8</div><ul><li>The cell body is the {{soma}}.</li><li>Its cytoplasm is the {{perikaryon}}.</li><li>{{Dendrites}} receive signals from other neurons.</li><li>A typical neuron has a single {{axon}}.</li><li>Several {{dendrites}} make many CNS neurons {{multipolar}}.</li></ul></div>"},{"t":"open","id":"N1","src":"Nervous tissue, p.8","core":true,"q":"Which process primarily receives input from other neurons?","ans":"dendrite","ex":"The cited teaching slide supports this answer."},{"t":"c","id":"N-C2","title":"Axonal transport directions","src":"Nervous tissue, p.17","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Nervous tissue, p.17</div><ul><li>Transport from soma toward the terminal is {{anterograde}}.</li><li>Transport from distal axon back to soma is {{retrograde}}.</li><li>{{Anterograde}} transport helps supply {{neurotransmitters}} to the terminal.</li><li>{{Retrograde}} transport returns worn material to the {{cell body}}.</li><li>The slide notes {{retrograde}} spread of certain {{toxins}}.</li></ul></div>"},{"t":"open","id":"N2","src":"Nervous tissue, p.17","core":false,"q":"Which direction carries material back to the cell body?","ans":"retrograde","ex":"The cited teaching slide supports this answer."},{"t":"c","id":"N-C3","title":"Myelin and nodes","src":"Nervous tissue, p.24","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Nervous tissue, p.24</div><ul><li>{{Myelin}} insulates axons and speeds impulse conduction.</li><li>In the CNS, {{myelin}} comes from {{oligodendroglia}}.</li><li>In the PNS, it comes from {{Schwann cells}}.</li><li>A wrapped stretch is an {{internodal segment}}.</li><li>The uninsulated gap is a node of {{Ranvier}}.</li></ul></div>"},{"t":"q","id":"N3","src":"AC81 MCQ p.5","core":true,"q":"Which of the following is the biomarker of astrocytes?","o":["Glial fibrillary acidic protein","S-100","Myelin basic protein (ไม่มีข้อมูลตัวเลือกอ่นื )"],"a":0,"ex":"The attached AC81 short key gives A: Glial fibrillary acidic protein.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"open","id":"N4","src":"Nervous tissue, p.24","core":true,"q":"Which glial cell myelinates peripheral axons?","ans":"Schwann cell","ex":"The cited teaching slide supports this answer."},{"t":"c","id":"N-C4","title":"Microglia","src":"Nervous tissue, p.40","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Nervous tissue, p.40</div><ul><li>{{Microglia}} are resident immune cells of the CNS.</li><li>They arise from the embryonic {{yolk sac}} lineage.</li><li>After injury, they migrate toward the affected {{site}}.</li><li>They remove pathogens and damaged cells by {{phagocytosis}}.</li><li>They can release inflammatory {{cytokines}}.</li></ul></div>"},{"t":"open","id":"N5","src":"Nervous tissue, p.40","core":false,"q":"Which CNS glia act as resident phagocytes?","ans":"microglia","ex":"The cited teaching slide supports this answer."},{"t":"c","id":"N-C5","title":"Cutaneous receptor contrasts","src":"Nervous tissue, p.30","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Nervous tissue, p.30</div><ul><li>{{Meissner corpuscles}} detect light touch.</li><li>{{Pacinian corpuscles}} detect vibration/pressure.</li><li>These are peripheral {{sensory receptors}}.</li><li>The Meissner receptor is associated with tactile {{discrimination}}.</li><li>The slide places these examples among {{exteroceptors}}.</li></ul></div>"},{"t":"q","id":"N6","src":"AC81 MCQ p.5","core":false,"q":"What is the mechanism of transporting neurotransmitters from soma to presynaptic cleft?","o":["Diffusion","Exocytosis","Transneuronal transport","Anterograde axonal transport","Retrograde axonal transport"],"a":3,"ex":"The attached AC81 short key gives D: Anterograde axonal transport.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"q","id":"N7","src":"AC81 MCQ p.5","core":true,"q":"Which of the following is not the function of Schwann cell?","o":["Release growth factors","Protect axon from injury","Guide nerve regeneration","Differentiate to replace damaged neuron","Reduce ion leakage"],"a":3,"ex":"The attached AC81 short key gives D: Differentiate to replace damaged neuron."},{"t":"open","id":"N8","src":"Nervous tissue, p.30","core":false,"q":"Which corpuscle detects light touch?","ans":"Meissner corpuscle","ex":"The cited teaching slide supports this answer."},{"t":"c","id":"N-C6","title":"Visual key · station 1","src":"AC81 Spot p.2","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · AC81 Spot p.2</div><ul><li>D → {{axon hillock}}</li><li>A → {{dendrite}}</li></ul></div><figure class=\"scan\"><a href=\"img/ac81-spot-2.png\" target=\"_blank\"><img src=\"img/ac81-spot-2.png\" alt=\"Cropped station image, AC81 Spot p.2\"></a><figcaption>AC81 Spot Test, p.2</figcaption></figure>"},{"t":"q","id":"N9","src":"AC81 Spot p.2","core":true,"q":"Identify axon hillock","o":["A","B","C","D"],"a":3,"ex":"The official AC81 Spot key maps this identification to label D on the source image.","fig":"<figure class=\"scan\"><a href=\"img/ac81-spot-2.png\" target=\"_blank\"><img src=\"img/ac81-spot-2.png\" alt=\"Station image\"></a><figcaption>AC81 Spot Test, p.2</figcaption></figure>"},{"t":"q","id":"N10","src":"AC81 Spot p.2","core":false,"q":"Identify dendrite","o":["A","B","C","D"],"a":0,"ex":"The official AC81 Spot key maps this identification to label A on the source image.","fig":"<figure class=\"scan\"><a href=\"img/ac81-spot-2.png\" target=\"_blank\"><img src=\"img/ac81-spot-2.png\" alt=\"Station image\"></a><figcaption>AC81 Spot Test, p.2</figcaption></figure>"},{"t":"c","id":"N-C7","title":"Visual key · station 2","src":"AC81 Spot p.3","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · AC81 Spot p.3</div><ul><li>B → {{lipofuschin pigment}}</li><li>C → {{karyon}}</li></ul></div><figure class=\"scan\"><a href=\"img/ac81-spot-3.png\" target=\"_blank\"><img src=\"img/ac81-spot-3.png\" alt=\"Cropped station image, AC81 Spot p.3\"></a><figcaption>AC81 Spot Test, p.3</figcaption></figure>"},{"t":"q","id":"N11","src":"AC81 Spot p.3","core":true,"q":"Identify lipofuschin pigment","o":["A","B","C","D"],"a":1,"ex":"The official AC81 Spot key maps this identification to label B on the source image.","fig":"<figure class=\"scan\"><a href=\"img/ac81-spot-3.png\" target=\"_blank\"><img src=\"img/ac81-spot-3.png\" alt=\"Station image\"></a><figcaption>AC81 Spot Test, p.3</figcaption></figure>"},{"t":"q","id":"N12","src":"AC81 Spot p.3","core":false,"q":"Identify karyon","o":["A","B","C","D"],"a":2,"ex":"The official AC81 Spot key maps this identification to label C on the source image.","fig":"<figure class=\"scan\"><a href=\"img/ac81-spot-3.png\" target=\"_blank\"><img src=\"img/ac81-spot-3.png\" alt=\"Station image\"></a><figcaption>AC81 Spot Test, p.3</figcaption></figure>"},{"t":"c","id":"N-C8","title":"Visual key · station 3","src":"AC81 Spot p.4","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · AC81 Spot p.4</div><ul><li>D → {{node of Ranvier}}</li><li>B → {{axon}}</li></ul></div><figure class=\"scan\"><a href=\"img/ac81-spot-4.png\" target=\"_blank\"><img src=\"img/ac81-spot-4.png\" alt=\"Cropped station image, AC81 Spot p.4\"></a><figcaption>AC81 Spot Test, p.4</figcaption></figure>"},{"t":"q","id":"N13","src":"AC81 Spot p.4","core":true,"q":"Identify node of Ranvier","o":["A","B","C","D"],"a":3,"ex":"The official AC81 Spot key maps this identification to label D on the source image.","fig":"<figure class=\"scan\"><a href=\"img/ac81-spot-4.png\" target=\"_blank\"><img src=\"img/ac81-spot-4.png\" alt=\"Station image\"></a><figcaption>AC81 Spot Test, p.4</figcaption></figure>"},{"t":"q","id":"N14","src":"AC81 Spot p.4","core":false,"q":"Identify axon","o":["A","B","C","D"],"a":1,"ex":"The official AC81 Spot key maps this identification to label B on the source image.","fig":"<figure class=\"scan\"><a href=\"img/ac81-spot-4.png\" target=\"_blank\"><img src=\"img/ac81-spot-4.png\" alt=\"Station image\"></a><figcaption>AC81 Spot Test, p.4</figcaption></figure>"},{"t":"c","id":"N-C9","title":"Visual key · station 4","src":"AC81 Spot p.5","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · AC81 Spot p.5</div><ul><li>D → {{postsynaptic neuron}}</li><li>B → {{vesicle}}</li></ul></div><figure class=\"scan\"><a href=\"img/ac81-spot-5.png\" target=\"_blank\"><img src=\"img/ac81-spot-5.png\" alt=\"Cropped station image, AC81 Spot p.5\"></a><figcaption>AC81 Spot Test, p.5</figcaption></figure>"},{"t":"q","id":"N15","src":"AC81 Spot p.5","core":true,"q":"Identify postsynaptic neuron","o":["A","B","C","D"],"a":3,"ex":"The official AC81 Spot key maps this identification to label D on the source image.","fig":"<figure class=\"scan\"><a href=\"img/ac81-spot-5.png\" target=\"_blank\"><img src=\"img/ac81-spot-5.png\" alt=\"Station image\"></a><figcaption>AC81 Spot Test, p.5</figcaption></figure>"},{"t":"q","id":"N16","src":"AC81 Spot p.5","core":false,"q":"Identify vesicle","o":["A","B","C","D"],"a":1,"ex":"The official AC81 Spot key maps this identification to label B on the source image.","fig":"<figure class=\"scan\"><a href=\"img/ac81-spot-5.png\" target=\"_blank\"><img src=\"img/ac81-spot-5.png\" alt=\"Station image\"></a><figcaption>AC81 Spot Test, p.5</figcaption></figure>"},{"t":"c","id":"N-C10","title":"Cutaneous receptors","src":"Nervous tissue lecture, p.30","html":"<div class=\"fbox\"><div class=\"fb-h\">Course principle · Nervous tissue lecture, p.30</div><ul><li>{{Meissner corpuscles}} detect light touch.</li><li>{{Pacinian corpuscles}} respond to vibration.</li><li>The receptor types are classified by {{stimulus modality}}.</li><li>Cutaneous receptors are examples of {{exteroceptors}}.</li><li>A receptor converts a stimulus into a {{sensory signal}}.</li></ul></div>"},{"t":"q","id":"N17","src":"AC80 p.4","core":true,"q":"What sensory input does meissner corpuscle detect?","o":["Pain","Pressure","Light touch","Cold","Hot"],"a":2,"ex":"The attached AC80 answer key gives option 3: Light touch."}]});

CVS.add({"id":"S","short":"Spinal cord","title":"Spinal cord and peripheral nerve","kind":"Lecture","blurb":"Cord organization, spinal nerves, meninges and injury patterns.","items":[{"t":"c","id":"S-C1","title":"Cord end and cauda equina","src":"Spinal cord lecture, p.13","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Spinal cord lecture, p.13</div><ul><li>The adult cord extends from the foramen magnum to about {{L1/L2}}.</li><li>Its tapered end is the {{conus medullaris}}.</li><li>Descending lumbosacral roots form the {{cauda equina}}.</li><li>The cervical enlargement serves the {{upper limb}}.</li><li>The lumbosacral enlargement serves the {{lower limb}}.</li></ul></div>"},{"t":"q","id":"S1","src":"AC81 MCQ p.7","core":true,"q":"Which vertebral level is commonly used for spinal tap?","o":["T11-12","L3-L4","L1-L2","S1-S2","S3-S4"],"a":1,"ex":"The attached AC81 short key gives B: L3-L4."},{"t":"open","id":"S2","src":"Spinal cord lecture, p.13","core":true,"q":"What is the tapered inferior end of the cord called?","ans":"conus medullaris","ex":"The cited teaching slide supports this answer."},{"t":"c","id":"S-C2","title":"Gray and white matter","src":"Spinal cord lecture, p.18","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Spinal cord lecture, p.18</div><ul><li>The dorsal gray horn processes {{sensory}} input.</li><li>The ventral gray horn contains {{motor}} neurons.</li><li>The intermediate zone lies between the two {{horns}}.</li><li>The outer {{white matter}} contains longitudinal tracts.</li><li>The {{central canal}} is at the core of the cord.</li></ul></div>"},{"t":"open","id":"S3","src":"Spinal cord lecture, p.18","core":false,"q":"Which gray horn contains somatic motor neurons?","ans":"ventral horn","ex":"The cited teaching slide supports this answer."},{"t":"c","id":"S-C3","title":"Autonomic efferent route","src":"Spinal cord lecture, p.29","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Spinal cord lecture, p.29</div><ul><li>Autonomic preganglionic neurons lie in the {{lateral horn}}.</li><li>Their axons exit via the {{ventral root}}.</li><li>They synapse in an autonomic {{ganglion}}.</li><li>A {{postganglionic}} fiber then reaches the target.</li><li>Targets include smooth muscle and {{glands}}.</li></ul></div>"},{"t":"open","id":"S4","src":"Spinal cord lecture, p.29","core":true,"q":"Where are sympathetic preganglionic cell bodies shown in this cord diagram?","ans":"lateral horn","ex":"The cited teaching slide supports this answer."},{"t":"c","id":"S-C4","title":"Peripheral receptor map","src":"Spinal cord lecture, p.41","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Spinal cord lecture, p.41</div><ul><li>{{Free nerve endings}} can signal pain.</li><li>{{Meissner corpuscles}} detect rapidly adapting light touch.</li><li>{{Pacinian corpuscles}} respond to pressure.</li><li>{{Muscle spindles}} detect muscle stretching.</li><li>{{Golgi tendon organs}} detect tendon stretching.</li></ul></div>"},{"t":"q","id":"S5","src":"AC81 MCQ p.7","core":true,"q":"A patient came to the Emergency room with median nerve neurotmesis, about 0.1 mm in length, with two clean-cut ends. Which treatment is the best within the first 24 hours?","o":["Direct nerve repair","Supportive treatment","Nerve repair with autograft","Nerve repair with allograft","Nerve repair with artificial nerve graft"],"a":0,"ex":"The attached AC81 short key gives A: Direct nerve repair.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"q","id":"S6","src":"AC81 MCQ p.7","core":false,"q":"Which type of nerve fiber conducts signals the fastest?","o":["A-alpha","A-beta","A-gamma","B","C"],"a":0,"ex":"The attached AC81 short key gives A: A-alpha.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"open","id":"S7","src":"Spinal cord lecture, p.41","core":false,"q":"Which receptor monitors muscle stretch?","ans":"muscle spindle","ex":"The cited teaching slide supports this answer."},{"t":"c","id":"S-C5","title":"Peripheral nerve disease patterns","src":"Spinal cord lecture, p.43","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Spinal cord lecture, p.43</div><ul><li>An isolated named nerve lesion is a {{mononeuropathy}}.</li><li>An entrapment is one possible {{traumatic}} cause.</li><li>Distal symmetric loss suggests {{polyneuropathy}}.</li><li>A typical distal pattern is called {{glove and stocking}}.</li><li>Distal symptoms can be more severe than {{proximal}} symptoms.</li></ul></div>"},{"t":"q","id":"S8","src":"AC81 MCQ p.6","core":false,"q":"Which dermatome is the left side of the xiphoid process?","o":["T4","T7","T10","C8","T12"],"a":1,"ex":"The attached AC81 short key gives B: T7.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"open","id":"S9","src":"Spinal cord lecture, p.43","core":false,"q":"What distribution suggests polyneuropathy rather than a single nerve lesion?","ans":"distal symmetric glove-and-stocking","ex":"The cited teaching slide supports this answer."},{"t":"c","id":"S-C6","title":"Visual key · station 8","src":"AC81 Spot p.9","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · AC81 Spot p.9</div><ul><li>S10 · {{Dorsolateral sulcus}}</li><li>S11 · {{Sensory nerve}}</li></ul></div><figure class=\"scan\"><a href=\"img/ac81-spot-9.png\" target=\"_blank\"><img src=\"img/ac81-spot-9.png\" alt=\"Cropped station image, AC81 Spot p.9\"></a><figcaption>AC81 Spot Test, p.9</figcaption></figure>"},{"t":"q","id":"S10","src":"AC81 Spot p.9","core":false,"q":"Identify structure","o":["Ventro median fissure","Ventrolateral sulcus","Dorso median sulcus","Dorsolateral sulcus"],"a":3,"ex":"The official short key gives D. The image key identifies CVS.add({"id":"C","short":"Cranial cavity","title":"Structures within cranial cavity","kind":"Lecture","blurb":"Scalp, meninges, cranial nerves and cerebral blood supply.","items":[{"t":"c","id":"C-C1","title":"A galea was a Roman","src":"Structures within cranial cavity, p.4","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Structures within cranial cavity, p.4</div><ul><li>soldier&#x27;s helmet. Galea {{aponeurotica}}</li><li>Nerve supply {{Arterial}} supply</li><li>1. {{Scalp}}: layers, blood &amp; nerve {{supplies}}</li><li>3. {{Cerebral}} meninges: dura mater, arachnoid</li><li>mater, pia mater, blood &amp; nerve {{supplies}}</li></ul></div><figure class=\"scan\"><a href=\"img/C-c1.png\" target=\"_blank\"><img src=\"img/C-c1.png\" alt=\"Course figure from Structures within cranial cavity, p.4\"></a><figcaption>Structures within cranial cavity, p.4</figcaption></figure>"},{"t":"open","id":"C1","src":"Structures within cranial cavity, p.4","core":true,"q":"What does galea aponeurotica refer to in the scalp lecture?","ans":"The scalp aponeurosis; the slide explains that galea is a term from a Roman soldier’s helmet.","ex":"This is the scalp term introduced on p.4."},{"t":"c","id":"C-C2","title":"Derivatives of dura mater:","src":"Structures within cranial cavity, p.13","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Structures within cranial cavity, p.13</div><ul><li>divide cranial cavity into {{compartments}}</li><li>{{Falx}} cerebri (cerebral {{falx}})</li><li>{{Falx}} (L) = {{sickle}}-shaped</li><li>{{Falx}} cerebelli ({{cerebellar}} {{falx}})</li><li>{{tentorium}} (L) = tent (roof)</li></ul></div>"},{"t":"q","id":"C2","src":"AC81 MCQ p.17","core":false,"q":"Rupture of the middle meningeal artery is most likely to cause hemorrhage in which of the following areas?","o":["Superficial to dura mater","Subarachnoid space","Deep to dura mater","Brain parenchyma","Perivascular space"],"a":0,"ex":"The attached AC81 short key gives A: Superficial to dura mater.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"open","id":"C3","src":"Structures within cranial cavity, p.13","core":false,"q":"Explain one key point from Derivatives of dura mater: in the cited slide.","ans":"divide cranial cavity into compartments","ex":"The model answer restates the teaching slide."},{"t":"c","id":"C-C3","title":"DURA MATER","src":"Structures within cranial cavity, p.17","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Structures within cranial cavity, p.17</div><ul><li>{{Pain}} fibers are most numerous where arteries and veins course in the dura.</li><li>{{Pain}} arising from the dura is {{generally}} referred, perceived as a headache</li><li>arising in {{cutaneous}} or mucosal regions supplied by</li><li>the involved cervical nerve or division of the {{trigeminal}} nerve.</li><li>({{Pachionian}} bodies): granular foveolae</li></ul></div><figure class=\"scan\"><a href=\"img/C-c3.png\" target=\"_blank\"><img src=\"img/C-c3.png\" alt=\"Course figure from Structures within cranial cavity, p.17\"></a><figcaption>Structures within cranial cavity, p.17</figcaption></figure>"},{"t":"q","id":"C4","src":"AC81 MCQ p.17","core":false,"q":"A lesion located in the midbrain is most likely to affect which of the following cranial nerves?","o":["Abducens nerve","Trochlear nerve","Trigeminal nerve","Facial nerve","Vestibulocochlear nerve"],"a":1,"ex":"The attached AC81 short key gives B: Trochlear nerve.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"open","id":"C5","src":"Structures within cranial cavity, p.17","core":true,"q":"Where are dural pain fibers most numerous, and how may pain be perceived?","ans":"They are numerous where dural arteries and veins course; pain may be referred as a headache in regions supplied by the involved cervical nerve or trigeminal division.","ex":"The lecture links dural vessels, pain fibers, and referred headache."},{"t":"c","id":"C-C4","title":"Anterior and posterior brain circulation","src":"Structures within cranial cavity, p.30","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · brain circulation, p.30</div><ul><li>The anterior circulation is the {{carotid}} system, supplied by the {{internal carotid arteries}}.</li><li>The posterior circulation is the {{vertebrobasilar}} system.</li><li>The posterior sources are the {{vertebral arteries}} and {{basilar artery}}.</li></ul></div>"},{"t":"open","id":"C6","src":"Structures within cranial cavity, p.30","core":false,"q":"Explain one key point from Anterior circulation in the cited slide.","ans":"6. Arterial supply of brain","ex":"The model answer restates the teaching slide."},{"t":"c","id":"C-C5","title":"Connections of cavernous sinuses","src":"Structures within cranial cavity, p.38","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Structures within cranial cavity, p.38</div><ul><li>7. {{Venous}} drainage within cranial cavity</li><li>Basilar {{venous}} plexus {{Pterygoid}} {{venous}} plexus</li><li>{{Internal}} vertebral {{venous}} plexus (spinal cord)</li><li>{{Superficial}}: superior cerebral veins (bridging veins)</li><li>{{Occipital}} sinus in falx cerebelli</li></ul></div>"},{"t":"q","id":"C7","src":"AC81 MCQ p.17","core":true,"q":"Which dural sinus is not directly connected to the confluence of sinuses?","o":["Straight sinus","Transverse sinus","Occipital sinus","Inferior sagittal sinus","Superior sagittal sinus"],"a":3,"ex":"The attached AC81 short key gives D: Inferior sagittal sinus.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"open","id":"C8","src":"Structures within cranial cavity, p.38","core":false,"q":"Explain one key point from Connections of cavernous sinus
