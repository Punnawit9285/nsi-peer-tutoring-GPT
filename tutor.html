CVS.add({"id":"A","short":"ANS cases","title":"ANS integration and regulation","kind":"Lecture","blurb":"Horner syndrome, Raynaud phenomenon and experimental ANS cases.","items":[{"t":"c","id":"A-C1","title":"Confirming Horner’s syndrome II: cocaine drop test","src":"ANS integration and regulation, p.9","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · ANS integration and regulation, p.9</div><ul><li>Confirming Horner’s syndrome {{II}}: cocaine drop test</li><li>Cocaine drop test {{NA}}: noradrenaline ({{norepinephrine}})</li><li>COMT: catechol-O-{{Methyltranferase}}</li><li>Cocaine = {{Norepinephrine}} reuptake</li><li>Cocaine – {{retention}} of NorE in</li></ul></div><figure class=\"scan\"><a href=\"img/A-c1.png\" target=\"_blank\"><img src=\"img/A-c1.png\" alt=\"Course figure from ANS integration and regulation, p.9\"></a><figcaption>ANS integration and regulation, p.9</figcaption></figure>"},{"t":"open","id":"A1","src":"ANS integration and regulation, p.9","core":true,"q":"What happens to the pupil after a cocaine drop in normal sympathetic signaling versus Horner syndrome?","ans":"Normal eyes dilate; the Horner pupil fails to dilate because the sympathetic norepinephrine signal is absent.","ex":"The lecture describes cocaine blocking norepinephrine reuptake."},{"t":"c","id":"A-C2","title":"Raynaud perfusion sequence","src":"ANS integration and regulation, p.15","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · ANS integration and regulation, p.15</div><ul><li>Cold exposure may make the fingers turn {{white}} then {{blue}} and become {{painful}}.</li><li>Persistent pain and {{tissue death}} point to failed {{perfusion}} rather than a transient color change.</li></ul></div>"},{"t":"open","id":"A2","src":"ANS integration and regulation, p.15","core":false,"q":"In Raynaud perfusion sequence, identify the missing course detail in the first statement.","ans":"white","ex":"The cited course page identifies white in this context."},{"t":"c","id":"A-C3","title":"NEUROCHALLENGE #3 – RABBIT","src":"ANS integration and regulation, p.28","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · ANS integration and regulation, p.28</div><ul><li>One pupil becomes smaller after {{sympathetic}} pathway</li><li>A. {{Increased}} {{sympathetic}} activity</li><li>B. {{Loss}} of {{sympathetic}} function</li><li>C. {{Increased}} nicotinic {{transmission}}</li><li>D. {{Increased}} {{skeletal}} muscle activity</li></ul></div><figure class=\"scan\"><a href=\"img/A-c3.png\" target=\"_blank\"><img src=\"img/A-c3.png\" alt=\"Course figure from ANS integration and regulation, p.28\"></a><figcaption>ANS integration and regulation, p.28</figcaption></figure>"},{"t":"open","id":"A3","src":"ANS integration and regulation, p.28","core":true,"q":"What clinical change makes the cold-triggered finger-color case a tissue-perfusion problem?","ans":"Persistent pain with tissue death, rather than a transient white-to-blue painful episode.","ex":"The case slide emphasizes tissue perfusion when symptoms no longer resolve."},{"t":"c","id":"A-C4","title":"Autonomic drugs","src":"ANS integration and regulation, p.32","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · ANS integration and regulation, p.32</div><ul><li>– {{Epinephrine}} – alpha and beta agonist</li><li>– {{Isoproterenol}} – beta agonist</li><li>– {{Phentolamine}} – alpha antagonist</li><li>– {{Propranolol}} – beta antagonist</li><li>– {{Neostigmine}} – acetylcholinesterase inhibitor</li></ul></div>"},{"t":"q","id":"A4","src":"AC81 MCQ p.18","core":false,"q":"A patient with fatigue, low energy, dizziness upon standing (for past several months) PE : tachycardia, low blood pressure. Taking antihypertensive medication that reduces sympathetic outflow from the brainstem. Her symptoms suggest excessive suppression of central sympathetic tone. Which medication should be prescribed to increase Norepinephrine release by blocking inhibitory autoreceptor on sympathetic nerve terminal","o":["beta-1 receptor antagonist","Beta-2 receptor antagonist","Alpha-1 receptor antagonist","Alpha-2 receptor antagonist","Muscarinic receptor antagonist"],"a":3,"ex":"The attached AC81 short key gives D: Alpha-2 receptor antagonist.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"open","id":"A5","src":"ANS integration and regulation, p.32","core":false,"q":"Explain one key point from Autonomic drugs in the cited slide.","ans":"– Epinephrine – alpha and beta agonist","ex":"The model answer restates the teaching slide."},{"t":"c","id":"A-C5","title":"Autonomic symptoms as location clues","src":"ANS integration and regulation, p.44","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · ANS integration and regulation, p.44</div><ul><li>Autonomic failure may present as a racing {{heart}}, white painful {{fingers}}, or an altered {{eye}}.</li><li>Trace each symptom to the affected {{physiology}} and localize the failed {{control system}}.</li></ul></div>"},{"t":"open","id":"A6","src":"ANS integration and regulation, p.44","core":false,"q":"In Autonomic symptoms as location clues, identify the missing course detail in the first statement.","ans":"heart","ex":"The cited course page identifies heart in this context."}]});

CVS.add({"id":"P","short":"ANS physiology","title":"ANS physiology","kind":"Lecture","blurb":"Autonomic circuits, transmitters and organ control.","items":[{"t":"c","id":"P-C1","title":"Where autonomic signaling acts","src":"ANS physiology, p.4","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · ANS physiology, p.4</div><ul><li>The teaching chain is membrane potential → {{action potential}} → {{nerve conduction}} → {{neuromuscular junction}} → muscle contraction.</li><li>Autonomic output also controls {{heart rate}}, {{airway diameter}}, and {{GI motility}}.</li></ul></div>"},{"t":"q","id":"P1","src":"AC81 MCQ p.17","core":true,"q":"65-year performs an operation. After anesthesiologist use halothane and succinylcholine as an anesthesia. The patients have much higher Heart rate, tachypnea, Hyperthermia (Body temperature is 39 celcius) and muscle rigidity including masseter. What is the cause of these symptoms?","o":["Excessive calcium influx due to excess calcium channel","Decrease calcium uptake back to SR due to malfunction of SERCA Pump","Excessive calcium influx because mutation of gene expressing channel protein Ryanodine receptors-1","Dysfunction of Neuromuscular junction causing neurotransmitter excess in synaptic cleft","Mitochondria malfunction causes no oxidative phosphorylation and ATP decrease"],"a":2,"ex":"The attached AC81 short key gives C: Excessive calcium influx because mutation of gene expressing channel protein Ryanodine receptors-1."},{"t":"open","id":"P2","src":"ANS physiology, p.4","core":true,"q":"In Where autonomic signaling acts, identify the missing course detail in the first statement.","ans":"action potential","ex":"The cited course page identifies action potential in this context."},{"t":"c","id":"P-C2","title":"Sympathetic nervous system","src":"ANS physiology, p.11","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · ANS physiology, p.11</div><ul><li>The {{ANS}} is not a two-button system – It is a dynamic control network.</li><li>– “{{Fight}} or flight reaction”</li><li>– {{Fast}} response, large area, fatigue feeling</li><li>– {{Prepare}} the body for demand</li><li>{{Parasympathetic}} nervous system</li></ul></div>"},{"t":"open","id":"P3","src":"ANS physiology, p.11","core":false,"q":"Explain one key point from Sympathetic nervous system in the cited slide.","ans":"The ANS is not a two-button system – It is a dynamic control network.","ex":"The model answer restates the teaching slide."},{"t":"c","id":"P-C3","title":"Autonomic control I: ocular functions","src":"ANS physiology, p.13","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · ANS physiology, p.13</div><ul><li>– {{Sympathetic}} – Superior cervical ganglion – iris</li><li>radial muscle – {{mydriasis}}</li><li>– {{Parasympathetic}} – Edinger-Westphal nucleus –</li><li>CN {{III}} – iris sphincter muscle – miosis</li><li>Dilators Iris sphincter {{Constrictors}}</li></ul></div><figure class=\"scan\"><a href=\"img/P-c3.png\" target=\"_blank\"><img src=\"img/P-c3.png\" alt=\"Course figure from ANS physiology, p.13\"></a><figcaption>ANS physiology, p.13</figcaption></figure>"},{"t":"open","id":"P4","src":"ANS physiology, p.13","core":true,"q":"Which autonomic routes and iris muscles produce mydriasis and miosis?","ans":"Sympathetic output via the superior cervical ganglion contracts the iris radial muscle for mydriasis; parasympathetic CN III output contracts the sphincter for miosis.","ex":"The ocular-control slide pairs each pathway with its iris muscle."},{"t":"c","id":"P-C4","title":"Sympathetic system – catecholamine/adrenergic receptors","src":"ANS physiology, p.24","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · ANS physiology, p.24</div><ul><li>(norepinephrine: NorE, {{NE}}; noradrenaline: NA)</li><li>alpha-1 {{Contractile}} effects (excitatory) of norepinephrine</li><li>(NE) on smooth muscle, {{especially}} blood vessels, iris</li><li>radial muscle, and urinary {{sphincter}} muscles</li><li>alpha-2 {{Relaxant}} effects of GI tract, presynaptic control</li></ul></div>"},{"t":"open","id":"P5","src":"ANS physiology, p.24","core":false,"q":"Explain one key point from Sympathetic system – catecholamine/adrenergic receptors in the cited slide.","ans":"Sympathetic system – catecholamine/adrenergic receptors","ex":"The model answer restates the teaching slide."},{"t":"c","id":"P-C5","title":"Parasympathetic system – acetylcholine receptors (acetylcholine)","src":"ANS physiology, p.26","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · ANS physiology, p.26</div><ul><li>{{Nicotinic}} (N1/NM) {{Fast}} activation of skeletal muscle</li><li>{{Nicotinic}} (N2/NN) {{Fast}} activation of postganglionic neurons in</li><li>autonomic ganglia ({{fast}} {{EPSP}})</li><li>{{Muscarinic}} M1 Inhibit ACh and NE release from autonomic</li><li>nerve {{terminals}}, slow {{EPSP}}</li></ul></div>"},{"t":"q","id":"P6","src":"AC81 MCQ p.18","core":false,"q":"A patient has decreased water saliva and dehydrated mucosa. Which drug should the doctor prescribe to directly stimulate salivary acinar cells?","o":["Alpha-1 agonist","Alpha-2 agonist","Beta-1 agonist","Beta-2 agonist","Muscarinic agonist"],"a":4,"ex":"The attached AC81 short key gives E: Muscarinic agonist.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"open","id":"P7","src":"ANS physiology, p.26","core":false,"q":"Explain one key point from Parasympathetic system – acetylcholine receptors (acetylcholine) in the cited slide.","ans":"Parasympathetic system – acetylcholine receptors (acetylcholine)","ex":"The model answer restates the teaching slide."}]});

CVS.add({"id":"M","short":"Membrane","title":"Membrane potential","kind":"Lecture","blurb":"Ionic gradients, resting potential and action potentials.","items":[{"t":"c","id":"M-C1","title":"Runner with hypotonic hyponatremia","src":"Membrane potential, p.5","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Membrane potential, p.5</div><ul><li>After a hot {{marathon}}, the runner develops {{confusion}}, muscle {{weakness}} and leg cramps.</li><li>His serum {{Na⁺}} and plasma {{osmolality}} are both markedly decreased.</li></ul></div>"},{"t":"q","id":"M1","src":"AC81 MCQ p.13","core":true,"q":"A 72-year-old man is brought to the emergency department with confusion, nausea, and headache. His family reports that he has been drinking excessive amounts of water over the past several days. On physical examination, he appears lethargic but is responsive. His blood pressure is normal. Laboratory result shows that his serum sodium is 118 mEq/L (Normal range is 135-145 mEq/L) and his serum potassium is 4.0 mEq/L (Normal range is 3.5-5.0 mEq/L) How will it affect his Action potential?","o":["High chance of getting sustained depolarization","Higher frequency","Higher Amplitude","Lower frequency and amplitude of action potential"],"a":3,"ex":"The attached AC81 short key gives D: Lower frequency and amplitude of action potential."},{"t":"q","id":"M2","src":"AC81 MCQ p.14","core":false,"q":"A 68-year-old woman was brought to the emergency department with confusion, nausea, and mild headache. Her daughter reports that the patient has been drinking large amounts of water daily for the past week. Laboratory result shows that his serum sodium is 110mEq/L (Normal range is 135-145 mEq/L) Which of the following is correct?","o":["RMP become less negative","Potassium equilibrium becomes less negative","RMP become less positive","Sodium equilibrium becomes less positive"],"a":3,"ex":"The attached AC81 short key gives D: Sodium equilibrium becomes less positive."},{"t":"open","id":"M3","src":"Membrane potential, p.5","core":true,"q":"In Runner with hypotonic hyponatremia, identify the missing course detail in the first statement.","ans":"marathon","ex":"The cited course page identifies marathon in this context."},{"t":"c","id":"M-C2","title":"WHERE DOES RMP COME FROM? – Three major concepts","src":"Membrane potential, p.12","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Membrane potential, p.12</div><ul><li>WHERE DOES {{RMP}} COME FROM? – Three major concepts</li><li>– [K+] {{HIGH}} inside, [Na+] {{HIGH}} outside</li><li>{{Selective}} membrane permeability</li><li>– At rest, the membrane is much more {{permeable}} to K⁺</li><li>than Na⁺ (through non-gated K {{channel}})</li></ul></div>"},{"t":"open","id":"M4","src":"Membrane potential, p.12","core":false,"q":"Explain one key point from WHERE DOES RMP COME FROM? – Three major concepts in the cited slide.","ans":"WHERE DOES RMP COME FROM? – Three major concepts","ex":"The model answer restates the teaching slide."},{"t":"c","id":"M-C3","title":"Generation of action potential – four phases","src":"Membrane potential, p.22","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Membrane potential, p.22</div><ul><li>{{Equilibrium}} potential of sodium (+60 mV)</li><li>{{Depolarization}} due to - Ion, influx/efflux</li><li>sodium influx via voltage- - {{Channel}}</li><li>{{potassium}} efflux via voltage</li><li>{{threshold}} gated {{potassium}} {{channel}}</li></ul></div>"},{"t":"open","id":"M5","src":"Membrane potential, p.22","core":true,"q":"What is threshold in action-potential generation?","ans":"The critical membrane potential to which the membrane must depolarize to initiate an action potential.","ex":"The slide defines threshold as the critical depolarization level."},{"t":"c","id":"M-C4","title":"Characteristics of action potential","src":"Membrane potential, p.25","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Membrane potential, p.25</div><ul><li>―the critical level which a membrane potential must be {{depolarized}}</li><li>to initiate {{depolarization}} phase of an action potential</li><li>― If stimulus exceeds {{threshold}}, neuron will give a complete</li><li>― {{Amplitude}} of action potential is fixed by ENa and EK</li><li>{{Refractory}} period – affects frequency of action potentials</li></ul></div>"},{"t":"open","id":"M6","src":"Membrane potential, p.25","core":false,"q":"Explain one key point from Characteristics of action potential in the cited slide.","ans":"Characteristics of action potential","ex":"The model answer restates the teaching slide."},{"t":"c","id":"M-C5","title":"THE SURPRISING PART – Two Roles of Depolarization","src":"Membrane potential, p.33","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Membrane potential, p.33</div><ul><li>Is Depolarization Always {{Excitatory}}?</li><li>{{Mild}} / transient depolarization</li><li>Vm moves closer to threshold→ ↑ {{excitability}}</li><li>{{Severe}} / sustained depolarization</li><li>More voltage-gated Na⁺ channels remain {{inactivated}}→ ↓</li></ul></div>"},{"t":"q","id":"M7","src":"AC81 MCQ p.14","core":true,"q":"A 65-year-old woman comes to the clinic complaining of muscle weakness, fatigue, and occasional palpitations over the past few days. She has a history of hypertension, normal heart rate and has been taking thiazide diuretics for 3 weeks. Laboratory results show that his serum potassium is 2.8 mEq/L (Normal range is 3.5-5.0 mEq/L) Which of the following is correct?","o":["RMP less negative and depolarization block","Hyperpolarization","Prolonged action potential duration","Increase excitability"],"a":1,"ex":"The attached AC81 short key gives B: Hyperpolarization.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"open","id":"M8","src":"Membrane potential, p.33","core":false,"q":"Explain one key point from THE SURPRISING PART – Two Roles of Depolarization in the cited slide.","ans":"THE SURPRISING PART – Two Roles of Depolarization","ex":"The model answer restates the teaching slide."},{"t":"c","id":"M-C6","title":"Hyperkalemia and excitability","src":"Membrane lecture, p.34","html":"<div class=\"fbox\"><div class=\"fb-h\">Course principle · Membrane lecture, p.34</div><ul><li>Raising extracellular {{K⁺}} makes the resting potential less negative.</li><li>Initial depolarization may increase {{excitability}}.</li><li>Sustained depolarization inactivates voltage-gated {{Na⁺ channels}}.</li><li>A smaller available sodium current reduces action-potential {{amplitude}}.</li><li>Severe sustained hyperkalemia can cause {{conduction failure}}.</li></ul></div>"},{"t":"q","id":"M9","src":"AC80 p.12","core":true,"q":"A 39-year-old teacher was taken to hospital. The laboratory report showed plasma potassium of 7.5 mmol/L (normal range 3.5 and 5 mmol/L). Which of the following is true about this patient?","o":["Action potentials are less frequent and have less amplitude.","Action potentials are more frequent and have higher amplitude.","Action potentials do not have any changes because they are the same no matter what.","Refractory period is prolonged.","Action potentials can’t be stimulated at all because cells are desensitized."],"a":4,"ex":"The attached AC80 answer key gives option 5: Action potentials can’t be stimulated at all because cells are desensitized..","flag":"the official key chooses complete failure (E); the slide distinguishes early hyperexcitability from severe sustained sodium-channel inactivation. Severity and time course matter."}]});

CVS.add({"id":"J","short":"Nerve/NMJ","title":"Physiology of nerve and NMJ","kind":"Lecture","blurb":"Axonal conduction, synaptic transmission and NMJ pharmacology.","items":[{"t":"c","id":"J-C1","title":"Weakness after infection: where is the lesion?","src":"Physiology of nerve and nmj, p.5","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Physiology of nerve and nmj, p.5</div><ul><li>Weeks after a respiratory {{infection}}, weakness ascends in both {{legs}}.</li><li>Distal {{tingling}}, loss of deep tendon {{reflexes}}, and facial weakness point toward a peripheral {{nerve}} process.</li></ul></div>"},{"t":"q","id":"J1","src":"AC81 MCQ p.14","core":true,"q":"A 36-year-old woman presents to the clinic with progressive weakness in both legs, numbness, and urinary retention for the past week. She also reports blurred vision in her right eye. The doctor found out that there is demyelination and laboratory results show NMO-IGg positive. Which of the following is correct about pathophysiology?","o":["Attack on AQP4 causing astrocyte death and secondary demyelination in axon of central nervous system","Direct CD8+ T cell- mediated killing of neurons","Peripheral nervous system demyelination","Occur only in NMO patients with negative serum anti-AQP4 antibody","Macrophage-mediated damage to Central nervous system fibers"],"a":0,"ex":"The attached AC81 short key gives A: Attack on AQP4 causing astrocyte death and secondary demyelination in axon of central nervous system."},{"t":"open","id":"J2","src":"Physiology of nerve and nmj, p.5","core":true,"q":"In Weakness after infection: where is the lesion?, identify the missing course detail in the first statement.","ans":"infection","ex":"The cited course page identifies infection in this context."},{"t":"c","id":"J-C2","title":"When the Nerve Conduction Pathway Is Damaged","src":"Physiology of nerve and nmj, p.16","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Physiology of nerve and nmj, p.16</div><ul><li>Disorder Main Site Key {{Mechanism}} Clinical Clue</li><li>Guillain–Barré PNS Acute immune-mediated {{Ascending}}</li><li>syndrome ({{GBS}}) peripheral neuropathy; weakness, areflexia,</li><li>commonly {{demyelinating}} often following</li><li>Multiple sclerosis CNS Immune-mediated CNS {{Neurological}} deficits</li></ul></div>"},{"t":"open","id":"J3","src":"Physiology of nerve and nmj, p.16","core":false,"q":"Explain one key point from When the Nerve Conduction Pathway Is Damaged in the cited slide.","ans":"When the Nerve Conduction Pathway Is Damaged","ex":"The model answer restates the teaching slide."},{"t":"c","id":"J-C3","title":"Slowed conduction in ascending weakness","src":"Physiology of nerve and nmj, p.17","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Physiology of nerve and nmj, p.17</div><ul><li>Post-infection ascending weakness with {{areflexia}} and slow nerve conduction points to {{GBS}}.</li><li>The impaired step is {{action potential propagation}} along a {{peripheral nerve}}, rather than {{ACh receptor}} binding at the NMJ.</li></ul></div>"},{"t":"open","id":"J4","src":"Physiology of nerve and nmj, p.17","core":true,"q":"In Slowed conduction in ascending weakness, identify the missing course detail in the first statement.","ans":"areflexia","ex":"The cited course page identifies areflexia in this context."},{"t":"c","id":"J-C4","title":"When the Signal Reaches the NMJ — But Transmission Fails","src":"Physiology of nerve and nmj, p.28","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Physiology of nerve and nmj, p.28</div><ul><li>When the Signal Reaches the {{NMJ}} — But Transmission Fails</li><li>Disorder Primary Site {{Autoantibodies}} What Goes Clinical Clue</li><li>Myasthenia {{Postsynaptic}} From thymus ↓ functional Fatigable weakness;</li><li>gravis ({{MG}}) gland nAChRs, ocular/bulbar</li><li>Lambert– {{Presynaptic}} From small cell ↓ voltage- Proximal weakness;</li></ul></div>"},{"t":"q","id":"J5","src":"AC81 MCQ p.15","core":true,"q":"A 28-year-old researcher presents to the hospital after accidental contact and possible inhalation of a marine toxin used in research. His symptoms include delayed muscle relaxation and muscle weakness. PE: prolonged muscle contraction and repetitive potential firing. Electrophysiological examination reveals delayed repolarization. There is no evidence of sodium channel blockade and neuromuscular junction disorder. Which of the following best describes the effect the toxin has on action potential?","o":["Calcium excessive influx at presynaptic, leading to massive ACh release","Increase Na channel permeability","Increase potassium leakage","Blockade of voltage- gated K+ channel","Blockade of non- K+ channel"],"a":3,"ex":"The attached AC81 short key gives D: Blockade of voltage- gated K+ channel."},{"t":"open","id":"J6","src":"Physiology of nerve and nmj, p.28","core":false,"q":"Explain one key point from When the Signal Reaches the NMJ — But Transmission Fails in the cited slide.","ans":"When the Signal Reaches the NMJ — But Transmission Fails","ex":"The model answer restates the teaching slide."},{"t":"c","id":"J-C5","title":"NeuroChallenge #8 – AchE inhibitors","src":"Physiology of nerve and nmj, p.33","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Physiology of nerve and nmj, p.33</div><ul><li>Why can severe {{acetylcholinesterase}} inhibition eventually</li><li>produce muscle weakness despite {{increased}} ACh?</li><li>A. ACh {{cannot}} bind nAChRs</li><li>B. {{Persistent}} depolarization can prevent effective action</li><li>C. ACh {{cannot}} enter the nerve {{terminal}}</li></ul></div>"},{"t":"q","id":"J7","src":"AC81 MCQ p.15","core":true,"q":"Doctors prescribe a Beta adrenergic agonist to a patient. What is the result of the medication?","o":["Sweat gland secretion","Internal urethra sphincter contraction","External urethra sphincter contract","Peristalsis and GI tract contraction","Urinary bladder muscle relaxation"],"a":4,"ex":"The attached AC81 short key gives E: Urinary bladder muscle relaxation.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"q","id":"J8","src":"AC81 MCQ p.15","core":false,"q":"A 58-year-old man with a 10-year history of type II diabetes mellitus presents with gradual onset numbness, tingling, and weakness in both feet. On examination, he has decreased vibration and pinprick sensation in a stocking distribution and reduced ankle reflexes. Electrophysiological studies show slowed nerve conduction velocities. Which of the following best explains the mechanism underlying the slowed nerve conduction in this patient?","o":["Decrease membrane resistance leading to increased ion leakage along the axon","Increase axial resistance of the axon","Upregulation of sodium channels to compensate for demyelination","High density of voltage-gated sodium channels in demyelinated segments","Increase in myelin sheath thickness"],"a":0,"ex":"The attached AC81 short key gives A: Decrease membrane resistance leading to increased ion leakage along the axon."},{"t":"q","id":"J9","src":"AC81 MCQ p.16","core":true,"q":"A 33-year-old woman presents with episodes of palpitations, tremors, excessive sweating, headache, and high blood pressure. Laboratory results show elevated metanephrine and normetanephrine levels, and a pheochromocytoma is found in the adrenal medulla. Which muscle has increased contractility due to the excessive circulating catecholamines?","o":["Iris sphincter muscle","Gastrointestinal tract smooth muscle","Smooth muscle of bladder","Internal urethra sphincter","External urethra sphincter"],"a":3,"ex":"The attached AC81 short key gives D: Internal urethra sphincter."},{"t":"open","id":"J10","src":"Physiology of nerve and nmj, p.33","core":false,"q":"Explain one key point from NeuroChallenge #8 – AchE inhibitors in the cited slide.","ans":"NeuroChallenge #8 – AchE inhibitors","ex":"The model answer restates the teaching slide."},{"t":"c","id":"J-C6","title":"NMJ receptor autoimmunity","src":"Nerve/NMJ lecture, p.25","html":"<div class=\"fbox\"><div class=\"fb-h\">Course principle · Nerve/NMJ lecture, p.25</div><ul><li>Myasthenia gravis targets the postsynaptic {{nicotinic ACh receptor}}.</li><li>Loss/internalization of receptors reduces the end-plate {{safety factor}}.</li><li>Typical weakness is {{fatigable}}.</li><li>Ptosis and {{diplopia}} can occur.</li><li>This NMJ disorder differs from CNS {{multiple sclerosis}}.</li></ul></div>"},{"t":"q","id":"J11","src":"AC80 p.14","core":true,"q":"A man was previously diagnosed with thymic hyperplasia and is now experiencing fluctuating muscle weakness, ptosis, diplopia and dysphagia. He was diagnosed with multiple sclerosis. What is the likely underlying cause of the symptoms?","o":["Autoimmune attack on AQP4","Pre-existing respiratory infection","Internalization of nAChR","White blood cell damages myelin causing multiple scarring in CNS","Pre-existing gastrointestinal infection"],"a":3,"ex":"The attached AC80 answer key gives option 4: White blood cell damages myelin causing multiple scarring in CNS. The vignette is clinically inconsistent with that diagnosis.","flag":"the stem calls this multiple sclerosis, but thymic association and fatigable ocular/bulbar weakness indicate myasthenia gravis. The attached key gives receptor internalization (C)."}]});

CVS.add({"id":"L","short":"Nerve/NMJ lab","title":"Nerve and NMJ lab","kind":"Lab","blurb":"Refractory period, CAP, conduction velocity and NMJ experiments.","items":[{"t":"c","id":"L-C1","title":"Read the nerve trace","src":"lab nerve and nmj, p.14","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · lab nerve and nmj, p.14</div><ul><li>A compound action potential is the summed activity of multiple {{nerve fibers}}.</li><li>Its {{latency}} reflects the delay after stimulation.</li><li>Its {{amplitude}} changes when fewer fibers contribute.</li><li>Compare {{distance}} with {{latency}} to reason about conduction {{velocity}}.</li></ul></div>"},{"t":"open","id":"L1","src":"lab nerve and nmj, p.14","core":true,"q":"In Read the nerve trace, identify the missing course detail in the first statement.","ans":"nerve fibers","ex":"The cited course page identifies nerve fibers in this context."},{"t":"c","id":"L-C2","title":"FIBER TYPES – Numerical Classification","src":"lab nerve and nmj, p.17","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · lab nerve and nmj, p.17</div><ul><li>Another Way to {{Classify}} • Clinical connection</li><li>Nerve {{Fibers}} • Fast {{fibers}} are generally</li><li>myelination • {{Motor}} function</li><li>→ faster conduction • {{Touch}}</li><li>Core principle: • {{Proprioception}}</li></ul></div>"},{"t":"open","id":"L2","src":"lab nerve and nmj, p.17","core":false,"q":"Explain one key point from FIBER TYPES – Numerical Classification in the cited slide.","ans":"FIBER TYPES – Numerical Classification","ex":"The model answer restates the teaching slide."},{"t":"c","id":"L-C3","title":"Fastest nerve fiber in the lab","src":"lab nerve and nmj, p.18","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · lab nerve and nmj, p.18</div><ul><li>A {{large}} diameter reduces axial resistance.</li><li>{{Myelination}} raises membrane resistance and lowers capacitance.</li><li>Together these favor fast {{conduction}}; the fastes  ACh in the cited slide.","ans":"NeuroChallenge #7 – High concentration of ACh","ex":"The model answer restates the teaching slide."}]});

CVS.add({"id":"E","short":"Eye and orbit","title":"Eye and orbit","kind":"Lecture","blurb":"Orbit, extrinsic muscles, eyeball layers and lacrimal apparatus.","items":[{"t":"c","id":"E-C1","title":"Supraorbital notch","src":"Eye and orbit, p.6","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Eye and orbit, p.6</div><ul><li>{{Optic}} canal: sphenoid (LW) at apex - {{optic}} n. &amp; ophthalmic a.</li><li>{{Superior}} orbital fissure: sphenoid (bet. GW&amp;LW) - CN III, IV, V1, VI</li><li>{{Inferior}} orbital fissure: bet. sphenoid (GW) &amp; maxilla - CN V2 &amp; zygomatic n.,</li><li>{{Infraorbital}} groove &amp; canal - {{infraorbital}} n.&amp; vss.</li><li> {{Exophthalmos}} (proptosis)  Enophthalmos Horner’s syndrome</li></ul></div>"},{"t":"open","id":"E1","src":"Eye and orbit, p.6","core":true,"q":"What passes through the optic canal and superior orbital fissure?","ans":"Optic canal: CN II and ophthalmic artery. Superior orbital fissure: CN III, IV, V1, and VI.","ex":"The orbital-foramina slide lists the transmitted structures."},{"t":"c","id":"E-C2","title":"Extrinsic muscles of eyeball","src":"Eye and orbit, p.14","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Eye and orbit, p.14</div><ul><li>{{Angle}} of gaze coinciding with</li><li>only rectus m. {{elevation}} &amp; {{depression}}</li><li>only oblique m. {{elevation}} &amp; {{depression}}</li><li>In fact, muscles almost always work {{together}}</li><li>in synergistic and {{antagonistic}} groups.</li></ul></div>"},{"t":"q","id":"E2","src":"AC81 MCQ p.20","core":false,"q":"Which muscle is used to move the eye upwards when the eye is abducted?","o":["Superior oblique","Inferior rectus","Medial rectus","Inferior oblique","Superior rectus"],"a":4,"ex":"The attached AC81 short key gives E: Superior rectus."},{"t":"open","id":"E3","src":"Eye and orbit, p.14","core":false,"q":"Explain one key point from Extrinsic muscles of eyeball in the cited slide.","ans":"Extrinsic muscles of eye CVS.add({"id":"R","short":"Reflex","title":"Physiology of reflex","kind":"Lecture","blurb":"Reflex arc, spinal somatic reflexes and autonomic reflexes.","items":[{"t":"c","id":"R-C1","title":"Five parts of a reflex arc","src":"Reflex lecture, p.4","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Reflex lecture, p.4</div><ul><li>A {{receptor}} detects the stimulus.</li><li>An {{afferent pathway}} carries input toward the center.</li><li>The {{reflex center}} integrates the signal.</li><li>An {{efferent pathway}} carries output.</li><li>The {{effector}} produces the response.</li></ul></div>"},{"t":"open","id":"R1","src":"Reflex lecture, p.4","core":true,"q":"List the path through a basic reflex arc.","ans":"receptor → afferent pathway → reflex center → efferent pathway → effector","ex":"The cited teaching slide supports this answer."},{"t":"c","id":"R-C2","title":"Muscle spindle structure","src":"Reflex lecture, p.20","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Reflex lecture, p.20</div><ul><li>A spindle contains {{intrafusal}} fibers.</li><li>The contractile {{myofibrils}} cluster near the fiber {{ends}}.</li><li>The central region has few or no {{myofibrils}}.</li><li>One nuclear arrangement is the nuclear {{bag}}.</li><li>The other nuclear arrangement is the nuclear {{chain}}.</li></ul></div>"},{"t":"open","id":"R2","src":"Reflex lecture, p.20","core":false,"q":"What are the two nuclear arrangements of intrafusal fibers?","ans":"nuclear bag and nuclear chain","ex":"The cited teaching slide supports this answer."},{"t":"c","id":"R-C3","title":"Withdrawal and crossed extension","src":"Reflex lecture, p.36","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Reflex lecture, p.36</div><ul><li>A painful stimulus triggers an ipsilateral {{flexor}} response.</li><li>The stimulated limb is rapidly {{withdrawn}}.</li><li>The opposite limb can extend via a {{crossed extensor}} reflex.</li><li>Contralateral extension helps maintain {{posture}}.</li><li>The first response is also called a {{withdrawal}} reflex.</li></ul></div>"},{"t":"q","id":"R3","src":"AC81 MCQ p.9","core":true,"q":"A first-year medical student crushed his toe on the corner of the table resulting in position away from the stimuli for more than 20-30 secs. Which of the following is the correct explanation of this mechanism?","o":["This effect doesn’t happen in cross- extensor reflex","This effect does not require interneurons","This duration last longer in non-painful stimuli","This effect is caused by reverberating neural circuit","can be inhibited by multisegmental suppression"],"a":3,"ex":"The attached AC81 short key gives D: This effect is caused by reverberating neural circuit."},{"t":"q","id":"R4","src":"AC81 MCQ p.10","core":false,"q":"What is correct when adding weight on a loading hand?","o":["Activated by golgi tendon organ","Flexor muscles relax","Extensor muscles contract","This reflex use multiple synapses element","Activated by increase in muscle fiber length"],"a":4,"ex":"The attached AC81 short key gives E: Activated by increase in muscle fiber length.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"open","id":"R5","src":"Reflex lecture, p.36","core":true,"q":"Why does the opposite limb extend during withdrawal?","ans":"to support posture while the stimulated limb withdraws","ex":"The cited teaching slide supports this answer."},{"t":"c","id":"R-C4","title":"Recovery after spinal shock","src":"Reflex lecture, p.50","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Reflex lecture, p.50</div><ul><li>Immediately after transection, spinal reflexes may be {{suppressed}}.</li><li>The initial period is {{spinal shock}}.</li><li>The slide describes recovery over days to {{months}}.</li><li>The simple {{stretch reflex}} often returns first.</li><li>Later responses can become {{hyperreflexic}}.</li></ul></div>"},{"t":"open","id":"R6","src":"Reflex lecture, p.50","core":false,"q":"Which simple reflex commonly returns first after spinal shock?","ans":"stretch reflex","ex":"The cited teaching slide supports this answer."},{"t":"c","id":"R-C5","title":"Achilles tendon reflex","src":"Reflex lecture, p.65","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Reflex lecture, p.65</div><ul><li>Tap the {{Achilles tendon}} to elicit the ankle jerk.</li><li>The afferent and efferent nerve is the {{tibial nerve}}.</li><li>The principal root levels are {{S1–S2}}.</li><li>The expected movement is ankle {{plantarflexion}}.</li><li>This is a {{deep tendon}} reflex.</li></ul></div>"},{"t":"q","id":"R7","src":"AC81 MCQ p.10","core":true,"q":"What is the correct position to use a percussion hammer to examine the reflex for elbow extension?","o":["Two inch above olecranon process","Distal one third radial","Just below elbow","Head of humerus","Cubital fossa"],"a":0,"ex":"The attached AC81 short key gives A: Two inch above olecranon process.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"q","id":"R8","src":"AC81 MCQ p.10","core":false,"q":"A patient came to the hospital immediately after an injury, and the doctor diagnosed him with C5-C6 Disc herniation. He had pain radiating to the right arm when examined. What is correct about his symptoms?","o":["Positive of Babinski&#x27;s maneuver sign","Hyporeflexia of right bicep reflex","Hyperreflexia of right tricep reflex","Hyperreflexia of left achilles tendon reflex","Hyporeflexia of left bicep reflex"],"a":1,"ex":"The attached AC81 short key gives B: Hyporeflexia of right bicep reflex.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"q","id":"R9","src":"AC81 MCQ p.10","core":true,"q":"When a doctor examines a patient’s patellar reflex (Knee jerk reflex), why does the doctor have to assign the patient to do the Jendrassik maneuver?","o":["To distract patients from the examination","To increase upper limb stretch reflex","enhance patient- doctor relationship","To make quadriceps muscle contract","To assess sensation in the lower limb"],"a":0,"ex":"The attached AC81 short key gives A: To distract patients from the examination."},{"t":"open","id":"R10","src":"Reflex lecture, p.65","core":false,"q":"Which nerve and roots carry the Achilles reflex?","ans":"tibial nerve, S1–S2","ex":"The cited teaching slide supports this answer."}]});

CVS.add({"id":"G","short":"Light","title":"Light in medicine","kind":"Lecture","blurb":"Optics, lasers and light-based clinical applications.","items":[{"t":"c","id":"G-C1","title":"m = medium, v = velocity, n = index of refraction","src":"Light in Medicine 2026, p.7","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Light in Medicine 2026, p.7</div><ul><li>C = the speed of light in {{vacuum}} 3.00x10</li><li>When light travels through any {{transparent}} medium other than {{vacuum}}, its velocity is reduced.</li><li>The frequency does not change on traveling but the {{wavelength}} becomes shorter as</li><li>= {{distance}} between crests of the wave.</li><li>= the maximum value attained by the electric field as the wave {{propagates}}; it determines the intensity of the wave</li></ul></div>"},{"t":"q","id":"G1","src":"AC81 MCQ p.4","core":true,"q":"What is the light principle of optic fiber endoscopy, used for internal organs?","o":["Refraction","Diffraction","Scattering","Polarization","Total internal reflection"],"a":4,"ex":"The attached AC81 short key gives E: Total internal reflection.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"open","id":"G2","src":"Light in Medicine 2026, p.7","core":true,"q":"When light enters a transparent medium, which wave property stays the same and which changes?","ans":"Frequency stays the same; speed decreases and wavelength becomes shorter according to the refractive index.","ex":"The slide relates speed, wavelength, frequency, and refractive index."},{"t":"c","id":"G-C2","title":"asma induced ablation","src":"Light in Medicine 2026, p.24","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Light in Medicine 2026, p.24</div><ul><li>the {{accelerated}} electrons, in turn, can collide with and ionize further atoms</li><li>cascade {{ionization}} and leads to a plasma formation</li><li>{{enables}} a very clean and</li><li>well defined removal of tissue without any evidence of thermal or {{mechanical}} damage</li><li>secondary {{mechanical}} side effects, however, such as the {{generation}} of a shock wave and cavitation bubbles</li></ul></div>"},{"t":"open","id":"G3","src":"Light in Medicine 2026, p.24","core":false,"q":"Explain one key point from asma induced ablation in the cited slide.","ans":"the accelerated electrons, in turn, can collide with and ionize further atoms","ex":"The model answer restates the teaching slide."},{"t":"c","id":"G-C3","title":"Optical Coherence Tomography (OCT)","src":"Light in Medicine 2026, p.34","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Light in Medicine 2026, p.34</div><ul><li>Optical Coherence Tomography ({{OCT}})</li><li>Partial Coherence {{Interferometry}}</li></ul></div>"},{"t":"open","id":"G4","src":"Light in Medicine 2026, p.34","core":true,"q":"Which diagnostic technique on the light lecture uses optical coherence?","ans":"Optical coherence tomography (OCT).","ex":"The modality is listed on the cited slide."},{"t":"c","id":"G-C4","title":"Types of Lasers Used","src":"Light in Medicine 2026, p.54","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Light in Medicine 2026, p.54</div><ul><li>{{Ablative}} lasers used for precision cutting, vaporization, and resurfacing of the lower genital tract</li><li>{{Typically}} non-{{ablative}} or fractional lasers that deliver controlled heat deeper into sub-epithelial tissues with minimal surface burning</li><li>Used in specialized endoscopic, laparoscopic, or {{hysteroscopic}} procedures (such as endometrial ablation or myoma removal)</li><li>{{Obstruction}} of Uterine tube</li></ul></div>"},{"t":"open","id":"G5","src":"Light in Medicine 2026, p.54","core":false,"q":"Explain one key point from Types of Lasers Used in the cited slide.","ans":"Ablative lasers used for precision cutting, vaporization, and resurfacing of the lower genital tract","ex":"The model answer restates the teaching slide."},{"t":"c","id":"G-C5","title":"Laser in caries treatment","src":"Light in Medicine 2026, p.72","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Light in Medicine 2026, p.72</div><ul><li>Laser for Oral {{Mucosa}} Tumor</li><li>Option term: {{Photocoagulation}}</li><li>Option term: {{Photochemical}} reaction</li><li>Option term: {{Photoablation}}</li><li>Option term: {{Photochemical}} {{interaction}}</li></ul></div>"},{"t":"q","id":"G6","src":"AC81 MCQ p.4","core":false,"q":"Which laser interaction is used to treat retinal detachment?","o":["Photocoagulation","Photochemical reaction","Photoablation","Photochemical interaction","Photodynamic therapy"],"a":0,"ex":"The attached AC81 short key gives A: Photocoagulation.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"q","id":"G7","src":"AC81 MCQ p.4","core":true,"q":"What is INCORRECT in properties of lasers?","o":["Laser has directionality","A good laser has polychromaticity","Active medium is one of the elements of laser","Optical feedback is one of the elements of laser","Energy input is one of the elements of laser"],"a":1,"ex":"The attached AC81 short key gives B: A good laser has polychromaticity.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"open","id":"G8","src":"Light in Medicine 2026, p.72","core":false,"q":"Explain one key point from Laser in caries treatment in the cited slide.","ans":"Laser in caries treatment","ex":"The model answer restates the teaching slide."},{"t":"c","id":"G-C6","title":"Cataract laser","src":"Light lecture, p.42","html":"<div class=\"fbox\"><div class=\"fb-h\">Course principle · Light lecture, p.42</div><ul><li>{{Femtosecond laser}} cataract surgery uses a {{femtosecond laser}}.</li><li>The interaction creates a focused {{plasma}} and p CVS.add({"id":"T","short":"Ear","title":"Ear","kind":"Lecture","blurb":"External, middle and inner ear anatomy.","items":[{"t":"c","id":"T-C1","title":"Collect and transmit sound wave to tympanic membrane","src":"Ear, p.3","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Ear, p.3</div><ul><li>1. {{Auricle}} (pinna): a {{cartilage}} plate with covering skin</li><li>2. {{External}} acoustic (auditory) meatus: S-shaped tunnel</li><li>outer 1/3 -&gt; {{cartilage}}, inner 2/3 -&gt; bone</li><li>skin of outer 1/3: sebaceous &amp; {{ceruminous}} (modified sweat)</li></ul></div>"},{"t":"open","id":"T1","src":"Ear, p.3","core":true,"q":"Trace the outer-ear path that collects sound before it reaches the middle ear.","ans":"Auricle (pinna) → external acoustic meatus → tympanic membrane.","ex":"The ear slide describes the auricle and canal collecting and transmitting sound to the membrane."},{"t":"c","id":"T-C2","title":"Tympanic cavity (middle ear)","src":"Ear, p.9","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Ear, p.9</div><ul><li>1.{{equalize}} pressure in the middle</li><li>ear &amp; {{outside}} to allow free</li><li>2.drain {{secretion}} from middle ear</li><li>2 {{muscles}} of soft palate: levator &amp;</li><li>tensor veli {{palatini}} help open</li></ul></div>"},{"t":"open","id":"T2","src":"Ear, p.9","core":false,"q":"Explain one key point from Tympanic cavity (middle ear) in the cited slide.","ans":"Tympanic cavity (middle ear)","ex":"The model answer restates the teaching slide."},{"t":"c","id":"T-C3","title":"Labyrinth (internal ear)","src":"Ear, p.22","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Ear, p.22</div><ul><li>{{Altered}} head position -&gt; otolith &amp; otolithic membrane pulled by</li><li>gravity -&gt; movement of {{stereocilia}} toward/away from kinocilium</li><li>&gt; {{altered}} ion channel activity &amp; {{neurotransmitter}} release -&gt;</li><li>sensory fibers of {{vestibular}} ganglion neurons</li><li ion}} during eating</li><li>{{Misdirection}} of regenerating gustatory fibers after injury (of</li><li>facial nerve above the {{geniculate}} gg)</li></ul></div>"},{"t":"q","id":"H6","src":"AC81 MCQ p.19","core":false,"q":"Injury to which nerve could lead to gustatory lacrimation (crocodile tear syndrome) ?","o":["Facial nerve","Mandibular nerve","Vagus nerve","Hypoglossal nerve","Glossopharyngeal nerve"],"a":0,"ex":"The attached AC81 short key gives A: Facial nerve."},{"t":"open","id":"H7","src":"ANS of head and neck, p.16","core":false,"q":"Explain one key point from Lesions of facial nerve (CN VII) in the cited slide.","ans":"Lesions of facial nerve (CN VII)","ex":"The model answer restates the teaching slide."},{"t":"c","id":"H-C5","title":"CN IX and the otic ganglion","src":"ANS of head and neck, pp.18–19","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · ANS of head and neck, pp.18–19</div><ul><li>CN {{IX}} is linked to the {{otic ganglion}} and parotid salivation.</li><li>Its lesion can reduce taste and general sensation from the posterior {{one-third of tongue}}.</li><li>The gag reflex afferent limb is CN {{IX}}; its efferent limb is CN {{X}}.</li></ul></div>"},{"t":"open","id":"H8","src":"ANS of head and neck, pp.18–19","core":false,"q":"In CN IX and the otic ganglion, identify the missing course detail in the first statement.","ans":"IX","ex":"The cited course page identifies IX in this context."}]});

CVS.add({"id":"W","short":"Sound/hearing","title":"Physics of sound and hearing","kind":"Lecture","blurb":"Sound waves, resonance, loudness and localization.","items":[{"t":"c","id":"W-C1","title":"Hearing level relative to threshold","src":"Physics of sound and hearing 2026, p.18","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Physics of sound and hearing 2026, p.18</div><ul><li>Sound level in {{dB HL}} uses the threshold at each {{frequency}} as reference.</li><li>At 8000 Hz the cited threshold is {{13 dB SPL}}.</li><li>Subtract the threshold in {{dB SPL}} from the measured level in {{dB SPL}} to obtain {{dB HL}}.</li></ul></div>"},{"t":"open","id":"W1","src":"Physics of sound and hearing 2026, p.18","core":true,"q":"In Hearing level relative to threshold, identify the missing course detail in the first statement.","ans":"dB HL","ex":"The cited course page identifies dB HL in this context."},{"t":"c","id":"W-C2","title":"Pinna cues for localization","src":"Physics of sound and hearing 2026, p.41","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Physics of sound and hearing 2026, p.41</div><ul><li>The {{pinna}} helps gather sound from in front.</li><li>Its curvature gives {{front–back}} and {{up–down}} localization cues.</li><li>The combined filtering by {{pinna}} and {{head}} is described as a {{head-related transfer function}}.</li></ul></div>"},{"t":"open","id":"W2","src":"Physics of sound and hearing 2026, p.41","core":false,"q":"In Pinna cues for localization, identify the missing course detail in the first statement.","ans":"pinna","ex":"The cited course page identifies pinna in this context."},{"t":"c","id":"W-C3","title":"Ear canal quarter-wave estimate","src":"Physics of sound and hearing 2026, p.48","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Physics of sound and hearing 2026, p.48</div><ul><li>The slide approximates wavelength as {{four}} times canal length.</li><li>For a {{2.3 cm}} canal, this gives {{9.2 cm}} or {{0.092 m}}.</li><li>At 343 m/s, the travel time across that wavelength is about {{0.000268 s}}.</li></ul></div>"},{"t":"q","id":"W3","src":"AC81 MCQ p.5","core":true,"q":"External acoustic meatus, which is a closed tube, has a distance of 2.5 cm. What is the lowest resonance frequency if air velocity is 340 m/s at 25 celsius.","o":["1360","1700","3400","6800","12000"],"a":2,"ex":"The attached AC81 short key gives C: 3400."},{"t":"open","id":"W4","src":"Physics of sound and hearing 2026, p.48","core":true,"q":"In Ear canal quarter-wave estimate, identify the missing course detail in the first statement.","ans":"four","ex":"The cited course page identifies four in this context."},{"t":"c","id":"W-C4","title":"Outer hair cells and OAE","src":"Physics of sound and hearing 2026, p.71","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Physics of sound and hearing 2026, p.71</div><ul><li>{{Outer hair cells}} move with the basilar membrane to {{amplify}} its motion.</li><li>Their activity can create sound emitted from the ear: {{otoacoustic emission}}.</li><li>A present {{OAE}} supports working {{outer hair cells}}.</li></ul></div>"},{"t":"q","id":"W5","src":"AC81 MCQ p.4","core":true,"q":"Differences in amplitude leads to which value is used to determine direction of sound?","o":["Interaural time difference","Interaural level difference","Interaural phase difference","Doppler","Phase"],"a":1,"ex":"The attached AC81 short key gives B: Interaural level difference.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"q","id":"W6","src":"AC81 MCQ p.5","core":false,"q":"What mechanism is used to amplify sound in the middle ear?","o":["Lever and hydraulics","Funnel","Doppler shift","Otoacoustic emissions","Sonar"],"a":0,"ex":"The attached AC81 short key gives A: Lever and hydraulics."},{"t":"open","id":"W7","src":"Physics of sound and hearing 2026, p.71","core":false,"q":"In Outer hair cells and OAE, identify the missing course detail in the first statement.","ans":"Outer hair cells","ex":"The cited course page identifies Outer hair cells in this context."},{"t":"c","id":"W-C5","title":"Vestibular input by movement","src":"Physics of sound and hearing 2026, p.99","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · Physics of sound and hearing 2026, p.99</div><ul><li>{{Angular acceleration}} is signaled by {{semicircular canals}}.</li><li>{{Linear acceleration}} is signaled by the {{saccule}} and {{utricle}}.</li><li>{{Gravity}} also informs head position.</li></ul></div>"},{"t":"open","id":"W8","src":"Physics of sound and hearing 2026, p.99","core":false,"q":"In Vestibular input by movement, identify the missing course detail in the first statement.","ans":"Angular acceleration","ex":"The cited course page identifies Angular acceleration in this context."},{"t":"c","id":"W-C6","title":"Travel time and ear resonance","src":"Sound/hearing lecture, p.48","html":"<div class=\"fbox\"><div class=\"fb-h\">Course principle · Sound/hearing lecture, p.48</div><ul><li>Travel time follows {{time = distance / speed}}.</li><li>The sound-wave example uses {{272.8 m}} and {{341 m/s}}.</li><li>Its travel time is {{0.8 s}}.</li><li>For a closed tube, the lowest resonance has wavelength about {{four times}} its length.</li><li>At 2.5 cm and 340 m/s, the first resonance is {{3400 Hz}}.</li><li>The earlier sound handout calculates a frequency near {{3731 Hz}}, approximated as {{4000 Hz}} (Physic of sound and Hearing, p.48).</li></ul></div>"},{"t":"q","id":"W9","src":"AC80 p.4","core":true,"q":"Sound wave travel 272.8m in the air with a velocity of 341 m/s. How long does it take for sound to travel?","o":["0.11","0.8","8","80","800"],"a":1,"ex":"The attached AC80 answer key gives option 2: 0.8."},{"t":"q","id":"W10","src":"AC80 p.4","core":true,"q":"จากการทดสอบการได้ยินในหูยักษ์พบว่ายักษ์จะได้ยินเสียงดังที่สุดเป็น resonance frequency ที่ 3731 Hz อยากทราบว่าหูของยักษ์มีความยาวรูหูสั้นที่สุดได้กเี่ มตร (กําหนด v= 341 m/s ที่ 25 องศาเซลเซียส มนุษย์เริ่มได้ยินเสียงที่ 7.5 dB SPL 1000 Hz)<span class=\"muted\">English gloss: Given a 3731 Hz resonance and sound speed 341 m/s, estimate the shortest ear-canal length.</span>","o":["0.02","0.08","0.2","0.8"],"a":0,"ex":"The attached AC80 answer key gives option 1: 0.02."}]});

CVS.add({"id":"V","short":"SGD cases","title":"SGD wrap-up","kind":"Lab","blurb":"Apply anatomy to lumbar disc and cranial nerve cases.","items":[{"t":"c","id":"V-C1","title":"Low-back pain case: presentation","src":"SGD Wrap-Up, pp.2, 6","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · SGD Wrap-Up, pp.2, 6</div><ul><li>The case begins with low back pain radiating down the {{right leg}}.</li><li>Weak {{plantarflexion}}, {{S1 dermatome}} sensation change and an absent {{Achilles reflex}} localize the {{S1 root}}.</li></ul></div>"},{"t":"open","id":"V1","src":"SGD Wrap-Up, pp.2, 6","core":true,"q":"In Low-back pain case: presentation, identify the missing course detail in the first statement.","ans":"right leg","ex":"The cited course page identifies right leg in this context."},{"t":"c","id":"V-C2","title":"Low back pain radiating down his right leg for two weeks","src":"SGD Wrap-Up, p.6","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · SGD Wrap-Up, p.6</div><ul><li>{{Antalgic}} gait and marked paraspinal muscle spasm</li><li>{{Weakness}} of right plantarﬂexion -&gt; S1 motor deﬁcit</li><li>Right lower limb sensory {{disturbance}} along S1 dermatome</li><li>{{Pathology}} at Right S1 nerve root</li><li>Option term: No {{sensation}} around great toe</li></ul></div>"},{"t":"q","id":"V2","src":"AC81 MCQ p.23","core":false,"q":"A patient complains of right leg pain radiating down the posterior leg after lifting a heavy object. Which of the following examinations confirms S1 nerve root compression?","o":["No sensation around great toe","Present of pain when wearing high heel","Absent of patellar reflex","Fully present of sensation around the back of the leg","Absent of dorsiflexion"],"a":2,"ex":"The attached AC81 short key gives C: Absent of patellar reflex."},{"t":"open","id":"V3","src":"SGD Wrap-Up, p.6","core":false,"q":"Explain one key point from Low back pain radiating down his right leg for two weeks in the cited slide.","ans":"Low back pain radiating down his right leg for two weeks","ex":"The model answer restates the teaching slide."},{"t":"c","id":"V-C3","title":"Exiting versus traversing lumbar root","src":"SGD Wrap-Up, p.11","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · SGD Wrap-Up, p.11</div><ul><li>At the L5–S1 disc, the {{L5}} root exits through its foramen.</li><li>The {{S1}} root traverses downward in the canal.</li><li>A posterolateral disc lesion here can affect the {{traversing}} root; a far lateral lesion tends to affect the {{exiting}} root.</li><li>Use the {{disc level}} with the motor, sensory and reflex findings.</li></ul></div><figure class=\"scan\"><a href=\"img/V-c3.png\" target=\"_blank\"><img src=\"img/V-c3.png\" alt=\"Course figure from SGD Wrap-Up, p.11\"></a><figcaption>SGD Wrap-Up, p.11</figcaption></figure>"},{"t":"open","id":"V4","src":"SGD Wrap-Up, p.11","core":true,"q":"In Exiting versus traversing lumbar root, identify the missing course detail in the first statement.","ans":"L5","ex":"The cited course page identifies L5 in this context."},{"t":"c","id":"V-C4","title":"Neck injury case: first findings","src":"SGD Wrap-Up, p.18","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · SGD Wrap-Up, p.18</div><ul><li>After a {{motorcycle}} accident, the patient has right neck {{ecchymosis}} and swelling.</li><li>He is {{alert}} and oriented, with BP {{122/76 mmHg}} and oxygen saturation {{99%}} on room air.</li></ul></div>"},{"t":"q","id":"V5","src":"AC81 MCQ p.22","core":true,"q":"A patient with Bell’s palsy presents with loss of the corneal reflex, but sensation on the cornea remains intact.","o":["Motor of trigeminal nerve impaired","Impairment of the nerve supplying orbicularis oris","Lost sensation from the ophthalmic branch of trigeminal nerve (ไม่มีข้อมูลตัวเลือกอ่นื )"],"a":1,"ex":"The attached AC81 short key gives B: Impairment of the nerve supplying orbicularis oris.","flag":"The key is attached, but this teaching slide has limited wording overlap. Check the full lecture and recalled stem before recording."},{"t":"open","id":"V6","src":"SGD Wrap-Up, p.18","core":false,"q":"In Neck injury case: first findings, identify the missing course detail in the first statement.","ans":"motorcycle","ex":"The cited course page identifies motorcycle in this context."},{"t":"c","id":"V-C5","title":"Horner localization after neck injury","src":"SGD Wrap-Up, p.24","html":"<div class=\"fbox\"><div class=\"fb-h\">Course facts · SGD Wrap-Up, p.24</div><ul><li>A lesion along the {{sympathetic chain}} can cause ipsilateral {{miosis}}, partial {{ptosis}} and {{anhidrosis}}.</li><li>Loss of facial sympathetic tone links these findings to {{Horner syndrome}}.</li></ul></div>"},{"t":"open","id":"V7","src":"SGD Wrap-Up, p.24","core":false,"q":"In Horner localization after neck injury, identify the missing course detail in the first statement.","ans":"sympathetic chain","ex":"The cited course page identifies sympathetic chain in this context."}]});

      '<div class="stations">' + st + '</div>' + planTable() +
      '<div class="traps-box"><div class="tp-head">วิธีใช้งานคู่กับหน้า Student Deck</div><ul>' +
      '<li>เปิด <b>Student Deck</b> ในหน้าจอที่ใช้อัดวิดีโอ และเปิดหน้า <b>Tutor Deck</b> นี้ไว้ดูโพยคำอธิบายควบคู่กัน (รหัสการ์ด เช่น <code>R12</code>, <code>F-C2</code>, <code>D-C3</code> ตรงกันทั้งหมด)</li>' +
      '<li>เปิด Student Deck กับหน้านี้ใน<b>เบราว์เซอร์เดียวกัน</b> (คนละแท็บหรือคนละหน้าต่าง) แล้วเปิด <b>Follow student</b> ไว้ เมื่อเลื่อนการ์ดในหน้า Student หน้านี้จะเลื่อนตามไปการ์ดเดียวกันเอง</li>' +
      '<li>กล่อง <b>SAY</b> คือประโยคภาษาอังกฤษสั้นๆ สำหรับพูดตอนอัด ส่วน bullet ภาษาไทยไว้อ่านทำความเข้าใจก่อนพูด</li>' +
      '<li>กดปุ่ม <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> หรือ <kbd>Space</kbd> เพื่อเลื่อนการ์ดทีละข้อในโหมด <b>Present</b> หรือกด <kbd>B</kbd> เพื่อดูรายการทั้งหมดแบบ <b>Browse</b></li>' +
      '<li>ติ๊ก <b>Core only</b> เพื่อกรองเฉพาะข้อหลัก (' + core + ' ข้อ) ที่คัดมาสำหรับอัดวิดีโอสรุป</li>' +
      '</ul></div></article>';
  }

  /* ---------- figure zoom ---------- */
  var zoom = document.createElement('div');
  zoom.className = 'zoom'; zoom.hidden = true;
  zoom.setAttribute('role', 'dialog'); zoom.setAttribute('aria-label', 'Enlarged figure (click or press Esc to close)');
  zoom.innerHTML = '<div class="zbox"><div class="zpaper"><img alt=""></div><p class="zcap"></p></div>';
  document.body.appendChild(zoom);
  function openZoom(im) {
    var fig = im.closest('figure'), cap = fig ? fig.querySelector('figcaption') : null, zi = zoom.querySelector('img');
    zi.src = im.currentSrc || im.src; zi.alt = im.alt || '';
    zoom.querySelector('.zcap').innerHTML = cap ? cap.innerHTML : '';
    zoom.hidden = false;
  }
  function closeZoom() { zoom.hidden = true; }
  zoom.addEventListener('click', closeZoom);

  /* ---------- present mode ---------- */
  function setTabs(si) {
    var tabs = $('tabs').children;
    for (var i = 0; i < tabs.length; i++) tabs[i].setAttribute('aria-current', i === si ? 'true' : 'false');
  }
  function setHash(id) { try { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (e) { } }
  function renderStage() {
    var it = seq[idx];
    $('stage').innerHTML = it.t === 'intro' ? renderIntro() : it.t === 'sec' ? renderSec(it.si) : it.t === 'c' ? renderC(it) : renderQ(it);
    var si = secIndex(it);
    setTabs(si);
    if (si < 0) { $('pos').innerHTML = 'Start'; }
    else {
      var n = 0, k = 0;
      for (var i = 0; i < seq.length; i++) { if (secIndex(seq[i]) === si && seq[i].t !== 'sec') { n++; if (seq[i] === it) k = n; } }
      $('pos').innerHTML = S[si].short + ' &#183; ' + (it.t === 'sec' ? 'intro' : k + ' / ' + n) + (it.t === 'sec' ? '' : ' &#183; <span>' + it.id + '</span>');
    }
    $('progBar').style.width = (100 * idx / (seq.length - 1)) + '%';
    $('prev').disabled = idx === 0;
    $('next').disabled = idx === seq.length - 1;
    setHash(it.id);
    LS.set('pos', it.id);
  }
  function go(d) {
    var n = Math.max(0, Math.min(seq.length - 1, idx + d));
    if (n === idx) return;
    idx = n; renderStage();
    try { window.scrollTo(0, 0); } catch (e) { }
  }
  function gotoSec(si) {
    if (view === 'present') { var k = find('sec-' + S[si].id); if (k >= 0) { idx = k; renderStage(); try { window.scrollTo(0, 0); } catch (e) { } } }
    else { var h = document.querySelector('#b-' + S[si].id + ' > header'); if (h) h.scrollIntoView({ block: 'start' }); setTabs(si); }
  }
  function selectOpt(it, v, card) {
    var st = state[it.id] = state[it.id] || {};
    st.sel = st.sel === v ? undefined : v;
    var opts = card.querySelectorAll('.opt');
    for (var i = 0; i < opts.length; i++) {
      var ov = opts[i].getAttribute('data-v');
      var match = st.sel !== undefined && (it.t === 'tf' ? (ov === 'true') === st.sel : parseInt(ov, 10) === st.sel);
      opts[i].classList.toggle('sel', match);
    }
  }
  function jumpTo(id) {
    if (!id) return false;
    var k = find(id);
    if (k < 0 && byId[id]) { coreOnly = false; $('coreOnly').checked = false; LS.set('core', false); buildSeq(); k = find(id); }
    if (k < 0) return false;
    idx = k;
    if (view !== 'present') setView('present'); else renderStage();
    return true;
  }

  /* ---------- browse mode ---------- */
  function renderBrowse() {
    var h = '';
    S.forEach(function (s) {
      h += '<section class="bsec" id="b-' + s.id + '"><header><div class="eyebrow"><span class="chip kind">' + s.kind + '</span><span class="id">Section ' + s.id + '</span></div><h2>' + s.title + '</h2><p>' + ((THAI_SEC[s.id] && THAI_SEC[s.id].big) || s.blurb) + '</p></header>';
      s.items.forEach(function (it) { if (coreOnly && isQ(it) && !it.core) return; h += it.t === 'c' ? renderC(it) : renderQ(it); });
      h += '</section>';
    });
    $('blist').innerHTML = h;
    applySearch();
  }
  function applySearch() {
    var q = ($('q').value || '').trim().toLowerCase(), n = 0, tot = 0;
    var cards = $('blist').querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      tot++;
      var show = !q || cards[i].textContent.toLowerCase().indexOf(q) >= 0;
      cards[i].hidden = !show;
      if (show) n++;
    }
    $('bcount').textContent = q ? n + ' / ' + tot + ' การ์ด' : tot + ' การ์ด';
  }
  function setView(v) {
    view = v; LS.set('view', v);
    $('present').hidden = v !== 'present';
    $('browse').hidden = v !== 'browse';
    $('vPresent').setAttribute('aria-pressed', v === 'present' ? 'true' : 'false');
    $('vBrowse').setAttribute('aria-pressed', v === 'browse' ? 'true' : 'false');
    if (v === 'browse') {
      renderBrowse();
      var it = seq[idx], si = secIndex(it), el = null;
      if (it.t === 'c' || isQ(it)) el = document.querySelector('#blist [data-id="' + it.id + '"]');
      if (!el && si >= 0) el = document.querySelector('#b-' + S[si].id + ' > header');
      if (el) el.scrollIntoView({ block: 'start' });
      setTabs(Math.max(si, 0));
    } else {
      renderStage();
    }
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target : null;
    var im = t ? t.closest('.scan img') : null;
    if (im) { openZoom(im); return; }
    var b = t ? t.closest('button') : null;
    if (!b) return;
    if (b.classList.contains('opt')) {
      var card = b.closest('.qcard'); if (!card) return;
      var it = byId[card.getAttribute('data-id')];
      var raw = b.getAttribute('data-v');
      selectOpt(it, it.t === 'tf' ? raw === 'true' : parseInt(raw, 10), card);
      return;
    }
    if (b.classList.contains('station') || b.classList.contains('tab')) { gotoSec(parseInt(b.getAttribute('data-sec'), 10)); return; }
  });
  $('prev').addEventListener('click', function () { go(-1); });
  $('next').addEventListener('click', function () { go(1); });
  $('vPresent').addEventListener('click', function () { setView('present'); });
  $('vBrowse').addEventListener('click', function () { setView('browse'); });
  $('coreOnly').addEventListener('change', function () {
    var cur = seq[idx];
    coreOnly = this.checked; LS.set('core', coreOnly); buildSeq();
    var k = find(cur.id);
    if (k < 0) { var si = secIndex(cur); k = find('sec-' + S[Math.max(si, 0)].id); }
    idx = Math.max(0, k);
    if (view === 'present') renderStage(); else renderBrowse();
  });
  $('q').addEventListener('input', applySearch);
  $('themeBtn').addEventListener('click', function () {
    var root = document.documentElement, t = root.getAttribute('data-theme');
    var dark = t ? t === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next); LS.set('theme', next);
  });
  $('fsBtn').addEventListener('click', function () {
    try {
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else if (document.documentElement.requestFullscreen) { var p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () { }); }
    } catch (err) { }
  });
  document.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (!zoom.hidden) { if (k === 'Escape' || k === ' ' || k === 'Enter') { e.preventDefault(); closeZoom(); } return; }
    if (view !== 'present') { if (k === 'b' || k === 'B') setView('present'); return; }
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { go(1); e.preventDefault(); return; }
    if (k === 'ArrowLeft' || k === 'PageUp') { go(-1); e.preventDefault(); return; }
    if (k === 'b' || k === 'B') { setView('browse'); return; }
  });
  var tx = null;
  document.addEventListener('touchstart', function (e) {
    if (view !== 'present' || e.touches.length !== 1) { tx = null; return; }
    var t = e.target; if (t && t.closest && t.closest('.tblwrap, .tabs')) { tx = null; return; }
    tx = [e.touches[0].clientX, e.touches[0].clientY];
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!tx) return;
    var dx = e.changedTouches[0].clientX - tx[0], dy = e.changedTouches[0].clientY - tx[1];
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) go(dx < 0 ? 1 : -1);
    tx = null;
  }, { passive: true });
  window.addEventListener('hashchange', function () { jumpTo(location.hash.slice(1)); });

  /* ---------- follow the student deck (same browser, another tab or window) ---------- */
  var follow = LS.get('follow', true);
  function readDeckPos() { try { var v = localStorage.getItem('nsideck:pos'); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function followTo(id) {
    if (!follow || !id || (view === 'present' && seq[idx] && seq[idx].id === id)) return;
    if (view === 'browse') { var el = document.querySelector('#blist [data-id="' + id + '"]'); if (el) { el.scrollIntoView({ block: 'start' }); return; } }
    if (jumpTo(id)) { try { window.scrollTo(0, 0); } catch (e) { } }
  }
  window.addEventListener('storage', function (e) { if (e.key === 'nsideck:pos' && e.newValue) { try { followTo(JSON.parse(e.newValue)); } catch (err) { } } });
  try { var bc = new BroadcastChannel('nsi-peer'); bc.onmessage = function (e) { if (e.data && e.data.pos) followTo(e.data.pos); }; } catch (e) { }
  $('follow').checked = follow;
  $('follow').addEventListener('change', function () { follow = this.checked; LS.set('follow', follow); if (follow) followTo(readDeckPos()); });

  /* ---------- start ---------- */
  $('tabs').innerHTML = S.map(function (s, si) { return '<button type="button" class="tab" data-sec="' + si + '"><span class="k">' + s.id + '</span>' + s.short + '</button>'; }).join('');
  var th = LS.get('theme', null); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th);

  function start(data) {
    data = data || {};
    if (data.state) state = data.state;
    coreOnly = typeof data.coreOnly === 'boolean' ? data.coreOnly : !!LS.get('core', false);
    $('coreOnly').checked = coreOnly;
    buildSeq();
    var want = location.hash ? location.hash.slice(1) : (data.pos || (follow && readDeckPos()) || LS.get('pos', 'start'));
    var k = find(want); idx = k >= 0 ? k : 0;
    setView(data.view || LS.get('view', 'present'));
  }
  var hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') {
    try { hot.snapshot(function () { return { state: state, view: view, coreOnly: coreOnly, pos: seq[idx] && seq[idx].id }; }); } catch (e) { }
  }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
</body>
</html>
